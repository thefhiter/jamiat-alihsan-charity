            '<td><span class="tag gray">' + U.esc(b.fileNo || "—") + "</span></td>" +
            '<td><a href="#" data-open="' + b.id + '" style="font-weight:800">' + U.esc(fullName(b)) + "</a></td>" +
            "<td>" + U.esc(b.phone || "—") + "</td>" +
            "<td>" + U.esc(b.marital || "—") + "</td>" +
            '<td style="text-align:center">' + (b.members ? U.fmtNum(b.members) : "—") + "</td>" +
            "<td>" + catTag(b) + "</td>" +
            '<td style="text-align:center">' + (aidCount ? '<span class="tag green">' + aidCount + "</span>" : '<span class="muted">0</span>') + "</td>" +
            '<td><div class="t-actions">' +
              '<button class="icon-btn" data-open="' + b.id + '" title="عرض الملف">👁️</button>' +
              '<button class="icon-btn" data-edit="' + b.id + '" title="تعديل">✏️</button>' +
              '<button class="icon-btn" data-print="' + b.id + '" title="طباعة">🖨️</button>' +
              '<button class="icon-btn" data-arch="' + b.id + '" title="' + (b.archived ? "استرجاع" : "أرشفة") + '">' + (b.archived ? "♻️" : "📥") + "</button>" +
              '<button class="icon-btn danger" data-del="' + b.id + '" title="حذف">🗑️</button>' +
            "</div></td></tr>";
        }).join("");
        body =
          '<div class="table-wrap"><table><thead><tr>' +
          "<th>رقم الملف</th><th>الاسم واللقب</th><th>الهاتف</th><th>الحالة العائلية</th>" +
          "<th>عدد الأفراد</th><th>الصنف</th><th>المساعدات</th><th>إجراءات</th>" +
          "</tr></thead><tbody>" + tr + "</tbody></table></div>";
      }

      container.innerHTML =
        '<div class="toolbar no-print">' +
          '<div class="search"><span class="si">🔍</span><input id="bSearch" placeholder="بحث بالاسم، رقم الملف، ب.ت.و، الهاتف، أو اسم فرد…" value="' + U.esc(state.q) + '"></div>' +
          '<div class="filter-pills">' +
            '<button class="pill ' + (state.filter === "active" ? "active" : "") + '" data-flt="active">الحالات النشطة</button>' +
            '<button class="pill ' + (state.filter === "archived" ? "active" : "") + '" data-flt="archived">الأرشيف</button>' +
          "</div><div class='spacer' style='flex:1'></div>" +
          '<button class="btn secondary" id="bPrintList"><span class="ico">🖨️</span> طباعة القائمة</button>' +
          '<button class="btn secondary" id="bExport"><span class="ico">⬇️</span> تصدير Excel</button>' +
          '<button class="btn" id="bAdd"><span class="ico">＋</span> إضافة عائلة</button>' +
        "</div>" + body;

      var srch = document.getElementById("bSearch");
      srch.oninput = U.debounce(function () { state.q = srch.value; paint(); keepFocus(); }, 180);
      document.getElementById("bAdd").onclick = function () { openForm(null, paint); };
      document.getElementById("bExport").onclick = exportCSV;
      document.getElementById("bPrintList").onclick = function () {
        var l = rows();
        if (!l.length) return U.toast("لا توجد بيانات للطباعة", "info");
        U.printTable("قائمة العائلات", ["رقم الملف", "الاسم واللقب", "الهاتف", "الحالة العائلية", "عدد الأفراد", "الصنف", "المساعدات"],
          l.map(function (b) {
            return [b.fileNo || "—", fullName(b), b.phone || "—", b.marital || "—",
              b.members || "—", b.category || "—", DB.where("aid", "beneficiaryId", b.id).length];
          }), { subtitle: state.filter === "archived" ? "الأرشيف" : "الحالات النشطة" });
      };
      container.querySelectorAll("[data-flt]").forEach(function (el) {
        el.onclick = function () { state.filter = el.getAttribute("data-flt"); state.q = ""; paint(); };
      });
      container.querySelectorAll("[data-open]").forEach(function (el) {
        el.onclick = function (e) { e.preventDefault(); App.navigate("beneficiaries", { id: el.getAttribute("data-open") }); };
      });
      container.querySelectorAll("[data-edit]").forEach(function (el) {
        el.onclick = function () { openForm(el.getAttribute("data-edit"), paint); };
      });
      container.querySelectorAll("[data-print]").forEach(function (el) {
        el.onclick = function () { printFile(el.getAttribute("data-print")); };
      });
      container.querySelectorAll("[data-arch]").forEach(function (el) {
        el.onclick = function () {
          var b = DB.get(COLL, el.getAttribute("data-arch"));
          DB.setArchived(COLL, b.id, !b.archived);
          U.toast(b.archived ? "تمت إعادة الملف للحالات النشطة" : "تمت أرشفة الملف"); paint();
        };
      });
      container.querySelectorAll("[data-del]").forEach(function (el) {
        el.onclick = function () {
          var b = DB.get(COLL, el.getAttribute("data-del"));
          U.confirm({
            title: "حذف الملف نهائياً", danger: true,
            message: "سيتم حذف ملف «" + fullName(b) + "» وكل مساعداته نهائياً. لا يمكن التراجع. هل أنت متأكّد؟",
            okText: "حذف نهائي",
            onOk: function () {
              DB.where("aid", "beneficiaryId", b.id).forEach(function (a) { DB.remove("aid", a.id); });
              DB.remove(COLL, b.id); U.toast("تم حذف الملف", "info"); paint();
            }
          });
        };
      });

      function keepFocus() { var s = document.getElementById("bSearch"); if (s) { s.focus(); s.selectionStart = s.value.length; } }
    }

    function exportCSV() {
      var list = rows();
      if (!list.length) return U.toast("لا توجد بيانات للتصدير", "info");
      var headers = [
        { label: "رقم الملف", key: "fileNo" }, { label: "الاسم", key: "firstName" },
        { label: "اللقب", key: "lastName" }, { label: "الكنية", key: "nickname" },
        { label: "ب.ت.و", key: "cin" }, { label: "الهاتف", key: "phone" },
        { label: "تاريخ الولادة", key: "dob" }, { label: "الحالة العائلية", key: "marital" },
        { label: "عدد الأفراد", get: function (b) { return b.members || ""; } },
        { label: "نوع العائلة", key: "familyType" }, { label: "الصنف", key: "category" },
        { label: "العمل", key: "work" }, { label: "تقدير الدخل", key: "income" },
        { label: "السكن", key: "housing" }, { label: "العنوان", key: "address" },
        { label: "التغطية الاجتماعية", key: "coverage" }
      ];
      U.download("المنتفعون-" + U.today() + ".csv", U.toCSV(list, headers), "text/csv");
      U.toast("تم تصدير ملف Excel (CSV)");
    }

    paint();
  };

  /* ============ تفاصيل الملف ============ */
  function detail(container, id) {
    var b = DB.get(COLL, id);
    if (!b) { container.innerHTML = '<div class="empty"><div class="e-ico">❓</div><h4>الملف غير موجود</h4></div>'; return; }

    function info(k, v) { return '<div class="info-item"><div class="k">' + k + '</div><div class="v">' + (v || "—") + "</div></div>"; }

    function paint() {
      b = DB.get(COLL, id);
      var aid = DB.where("aid", "beneficiaryId", id).sort(function (a, c) { return (c.date || "").localeCompare(a.date || ""); });
      var totalAid = aid.reduce(function (s, a) { return s + (parseFloat(a.amount) || 0); }, 0);

      var aidRows = aid.length ? aid.map(function (a) {
        return "<tr><td>" + U.fmtDate(a.date) + "</td><td>" + U.esc(a.type || "—") + "</td>" +
          "<td>" + U.esc(a.occasion || "—") + '</td><td class="money out">' + U.fmtMoney(a.amount) + "</td>" +
          '<td><div class="t-actions"><button class="icon-btn" data-aedit="' + a.id + '">✏️</button>' +
          '<button class="icon-btn danger" data-adel="' + a.id + '">🗑️</button></div></td></tr>';
      }).join("") : '<tr><td colspan="5" class="muted" style="text-align:center;padding:22px">لا توجد مساعدات مسجّلة بعد</td></tr>';

      var healthBits = [];
      if (b.chronic) healthBits.push('<span class="tag amber">مرض مزمن: ' + U.esc(b.chronicType || "غير محدّد") + "</span>");
      if (b.disabled) healthBits.push('<span class="tag red">إعاقة: ' + U.esc(b.disabilityType || "غير محدّد") + "</span>");
      if (b.pension) healthBits.push('<span class="tag green">ينتفع بجراية</span>');
      if (!healthBits.length) healthBits.push('<span class="tag gray">لا يوجد</span>');

      container.innerHTML =
        '<div class="toolbar no-print">' +
          '<button class="btn ghost" id="bBack">→ رجوع للقائمة</button><div class="spacer" style="flex:1"></div>' +
          '<button class="btn secondary" id="bPrint"><span class="ico">🖨️</span> طباعة الملف</button>' +
          '<button class="btn" id="bEdit"><span class="ico">✏️</span> تعديل</button>' +
        "</div>" +
        '<div class="detail-grid">' +
          '<div class="card profile-card"><div class="card-body">' +
            '<div class="profile-avatar">' + U.esc(U.initials(b.firstName, b.lastName)) + "</div>" +
            '<div class="pname">' + U.esc(fullName(b)) + "</div>" +
            '<div class="pfile">رقم الملف: ' + U.esc(b.fileNo || "—") + "</div>" +
            '<div style="margin-top:10px">' + catTag(b) +
              (b.familyType ? ' <span class="tag blue">' + U.esc(b.familyType) + "</span>" : "") +
              (b.archived ? ' <span class="tag gray">مؤرشف</span>' : "") + "</div>" +
            '<div style="margin-top:16px;border-top:1px solid var(--line);padding-top:14px;text-align:right">' +
              '<div class="info-list one">' +
                info("الهاتف", U.esc(b.phone)) +
                info("ب.ت.و", U.esc(b.cin)) +
                info("تاريخ الولادة", b.dob ? U.fmtDate(b.dob) + (U.age(b.dob) ? " (" + U.age(b.dob) + " سنة)" : "") : "—") +
                info("مكان الولادة", U.esc(b.birthPlace)) +
                info("العنوان", U.esc(b.address) + (b.postal ? " — " + U.esc(b.postal) : "")) +
              "</div></div>" +
          "</div></div>" +

          "<div>" +
            '<div class="card mb-16"><div class="card-head"><h3>👨‍👩‍👧 الحالة العائلية والصحية</h3></div><div class="card-body">' +
              '<div class="info-list">' +
                info("الحالة العائلية", U.esc(b.marital)) +
                info("عدد الأفراد", b.members ? U.fmtNum(b.members) : "—") +
                info("نوع العائلة", U.esc(b.familyType)) +
                info("الحالة الصحية", healthBits.join(" ")) +
                info("الضمان الاجتماعي", U.esc(b.ssn) + (b.cardExpiry ? " — صلوحية: " + U.fmtDate(b.cardExpiry) : "")) +
                info("التغطية الاجتماعية", U.esc(b.coverage)) +
              "</div>" +
            "</div></div>" +

            '<div class="card mb-16"><div class="card-head"><h3>💼 الوضعية المادية والسكن</h3></div><div class="card-body">' +
              '<div class="info-list">' +
                info("العمل", U.esc(b.work)) +
                info("تقدير الدخل الشهري", b.income ? U.fmtMoney(b.income) : "—") +
                info("مداخيل أخرى", U.esc(b.otherIncome)) +
                info("نوع السكن", U.esc(b.housing) + (b.rent ? " — كراء: " + U.fmtMoney(b.rent) : "")) +
                info("العون المكلّف", U.esc(b.agent)) +
                info("تاريخ الإدماج", b.joinDate ? U.fmtDate(b.joinDate) : U.fmtDate(b.createdAt)) +
              "</div>" +
              (b.notes ? '<div style="margin-top:12px"><div class="k" style="font-size:12px;color:var(--muted);font-weight:700">توصيف الحالة</div><div>' + U.esc(b.notes) + "</div></div>" : "") +
            "</div></div>" +

            '<div class="card"><div class="card-head"><h3>🎁 المساعدات الممنوحة</h3><div class="spacer"></div>' +
              '<span class="tag green">المجموع: ' + U.fmtMoney(totalAid) + "</span>" +
              '<button class="btn sm gold no-print" id="bAddAid" style="margin-inline-start:10px"><span class="ico">＋</span> إضافة مساعدة</button></div>' +
              '<div class="table-wrap" style="border:none;box-shadow:none;border-radius:0"><table><thead><tr>' +
              "<th>التاريخ</th><th>نوعية الإعانة</th><th>المناسبة</th><th>المقدار</th><th>إجراءات</th>" +
              "</tr></thead><tbody>" + aidRows + "</tbody></table></div>" +
            "</div>" +
          "</div>" +
        "</div>";

      document.getElementById("bBack").onclick = function () { App.navigate("beneficiaries"); };
      document.getElementById("bEdit").onclick = function () { openForm(id, paint); };
      document.getElementById("bPrint").onclick = function () { printFile(id); };
      document.getElementById("bAddAid").onclick = function () { App.aidForm(id, paint); };
      container.querySelectorAll("[data-aedit]").forEach(function (el) {
        el.onclick = function () { App.aidForm(id, paint, el.getAttribute("data-aedit")); };
      });
      container.querySelectorAll("[data-adel]").forEach(function (el) {
        el.onclick = function () {
          U.confirm({ title: "حذف المساعدة", danger: true, message: "حذف سجلّ المساعدة نهائياً؟", okText: "حذف",
            onOk: function () { DB.remove("aid", el.getAttribute("data-adel")); U.toast("تم الحذف", "info"); paint(); } });
        };
      });
    }
    paint();
  }

  /* ============ النموذج ============ */
  function chip(name, val, current) {
    return '<label class="radio-chip"><input type="radio" data-f="' + name + '" name="' + name + '" value="' + U.esc(val) + '"' +
      (current === val ? " checked" : "") + '><span>' + U.esc(val) + "</span></label>";
  }

  function openForm(id, after) {
    var b = id ? DB.get(COLL, id) : {};
    var isNew = !id;

    function opts(list, sel) {
      return '<option value="">— اختر —</option>' + list.map(function (o) {
        return '<option' + (sel === o ? " selected" : "") + ">" + U.esc(o) + "</option>";
      }).join("");
    }

    var body =
      '<div class="form-grid">' +
        '<div class="field"><label>رقم الملف</label><input data-f="fileNo" value="' + U.esc(b.fileNo || nextFileNo()) + '"></div>' +
        '<div class="field"><label>العون المكلّف بالمسك</label><input data-f="agent" value="' + U.esc(b.agent || "") + '" placeholder="اسم العون"></div>' +
      "</div>" +

      '<fieldset class="fieldset"><legend>① المعطيات الشخصية</legend><div class="form-grid">' +
        '<div class="field"><label>الاسم <span class="req">*</span></label><input data-f="firstName" value="' + U.esc(b.firstName || "") + '" required></div>' +
        '<div class="field"><label>اللقب <span class="req">*</span></label><input data-f="lastName" value="' + U.esc(b.lastName || "") + '" required></div>' +
        '<div class="field"><label>الكنية</label><input data-f="nickname" value="' + U.esc(b.nickname || "") + '" placeholder="إن وُجدت عند تشابه الأسماء"></div>' +
        '<div class="field"><label>رقم ب.ت.و</label><input data-f="cin" value="' + U.esc(b.cin || "") + '" inputmode="numeric"></div>' +
        '<div class="field"><label>تاريخ الولادة</label><input type="date" data-f="dob" value="' + U.esc(b.dob || "") + '"></div>' +
        '<div class="field"><label>مكان الولادة</label><input data-f="birthPlace" value="' + U.esc(b.birthPlace || "") + '"></div>' +
        '<div class="field"><label>الهاتف</label><input data-f="phone" value="' + U.esc(b.phone || "") + '" inputmode="tel"></div>' +
      "</div></fieldset>" +

      '<fieldset class="fieldset"><legend>② الضمان والتغطية الاجتماعية</legend><div class="form-grid">' +
        '<div class="field"><label>رقم الضمان الاجتماعي</label><input data-f="ssn" value="' + U.esc(b.ssn || "") + '"></div>' +
        '<div class="field"><label>صلوحية البطاقة (تاريخ الانتهاء)</label><input type="date" data-f="cardExpiry" value="' + U.esc(b.cardExpiry || "") + '"></div>' +
        '<div class="field full"><label>نوع التغطية الاجتماعية</label><select data-f="coverage">' + opts(COVERAGE, b.coverage) + "</select></div>" +
      "</div></fieldset>" +

      '<fieldset class="fieldset"><legend>③ الوضعية العائلية</legend>' +
        '<div class="field"><label>الحالة العائلية</label><div class="radio-row">' + MARITAL.map(function (m) { return chip("marital", m, b.marital); }).join("") + "</div></div>" +
        '<div class="form-grid" style="margin-top:12px">' +
          '<div class="field"><label>نوع العائلة</label><select data-f="familyType">' + opts(FAMILY_TYPE, b.familyType) + "</select></div>" +
          '<div class="field"><label>صنف الحالة (الأولوية)</label><select data-f="category">' + opts(CATEGORY, b.category) + "</select></div>" +
          '<div class="field"><label>عدد الأفراد بالعائلة</label><input type="number" min="1" data-f="members" value="' + U.esc(b.members || "") + '"></div>' +
        "</div>" +
      "</fieldset>" +

      '<fieldset class="fieldset"><legend>④ الحالة الصحية</legend>' +
        '<div class="form-grid">' +
          '<div class="field"><label class="check-inline"><input type="checkbox" data-f="chronic" id="chk_chronic"' + (b.chronic ? " checked" : "") + "> مريض مزمن</label>" +
            '<input data-f="chronicType" id="chronicType" placeholder="نوع المرض: سكري، ضغط، تنفّس…" value="' + U.esc(b.chronicType || "") + '"></div>' +
          '<div class="field"><label class="check-inline"><input type="checkbox" data-f="disabled" id="chk_dis"' + (b.disabled ? " checked" : "") + "> ذو إعاقة</label>" +
            '<input data-f="disabilityType" id="disType" placeholder="نوع الإعاقة" value="' + U.esc(b.disabilityType || "") + '"></div>' +
          '<div class="field full"><label class="check-inline"><input type="checkbox" data-f="pension"' + (b.pension ? " checked" : "") + "> ينتفع بجراية (منحة)</label></div>" +
        "</div>" +
      "</fieldset>" +

      '<fieldset class="fieldset"><legend>⑤ الوضعية المادية</legend><div class="form-grid">' +
        '<div class="field"><label>العمل / المهنة</label><select data-f="work">' + opts(WORK, b.work) + "</select></div>" +
        '<div class="field"><label>تقدير الدخل الشهري</label><input type="number" step="0.001" min="0" data-f="income" value="' + U.esc(b.income || "") + '"></div>' +
        '<div class="field full"><label>مداخيل أخرى</label><input data-f="otherIncome" value="' + U.esc(b.otherIncome || "") + '" placeholder="مصدر ومقدار المداخيل الأخرى"></div>' +
      "</div></fieldset>" +

      '<fieldset class="fieldset"><legend>⑥ السكن والعنوان</legend><div class="form-grid">' +
        '<div class="field full"><label>العنوان</label><input data-f="address" value="' + U.esc(b.address || "") + '"></div>' +
        '<div class="field"><label>الترقيم البريدي</label><input data-f="postal" value="' + U.esc(b.postal || "") + '" inputmode="numeric"></div>' +
        '<div class="field"><label>نوع المسكن</label><select data-f="housing" id="housingSel">' + opts(HOUSING, b.housing) + "</select></div>" +
        '<div class="field full" id="rentWrap" style="display:none"><label>تقدير ثمن الكراء (شهرياً)</label><input type="number" step="0.001" min="0" data-f="rent" value="' + U.esc(b.rent || "") + '"></div>' +
      "</div></fieldset>" +

      '<fieldset class="fieldset"><legend>⑦ الملف</legend><div class="form-grid">' +
        '<div class="field"><label>تاريخ الإدماج / التحيين</label><input type="date" data-f="joinDate" value="' + U.esc(b.joinDate || U.today()) + '"></div>' +
        '<div class="field full"><label>توصيف الحالة</label><textarea data-f="notes" placeholder="وصف موجز للحالة الاجتماعية والاحتياجات">' + U.esc(b.notes || "") + "</textarea></div>" +
      "</div></fieldset>";

    U.openModal({
      title: isNew ? "إضافة عائلة / حالة اجتماعية" : "تعديل ملف: " + fullName(b),
      wide: true,
      body: body,
      footer: '<button class="btn" id="bSave"><span class="ico">💾</span> حفظ الملف</button>' +
              '<button class="btn secondary" id="bCancel">إلغاء</button>',
      onOpen: function (root) {
        // إظهار حقل الكراء عند اختيار إيجار
        var hs = root.querySelector("#housingSel"), rentWrap = root.querySelector("#rentWrap");
        function toggleRent() { rentWrap.style.display = hs.value === "إيجار" ? "" : "none"; }
        hs.onchange = toggleRent; toggleRent();

        root.querySelector("#bCancel").onclick = U.closeModal;
        root.querySelector("#bSave").onclick = function () {
          var data = U.formData(root);
          if (!data.firstName || !data.lastName) { U.toast("الاسم واللقب إجباريان", "error"); return; }
          data.childrenMigrated = true; // الأفراد يُدارون كسجلّات مستقلّة في «المنتفعون»

          if (isNew) { DB.insert(COLL, data); U.toast("تمت إضافة العائلة بنجاح"); }
          else { DB.update(COLL, id, data); U.toast("تم تحديث الملف"); }
          U.closeModal();
          after && after();
        };
      }
    });
  }

  /* ============ طباعة الملف ============ */
  function printFile(id) {
    var b = DB.get(COLL, id);
    if (!b) return;
    var aid = DB.where("aid", "beneficiaryId", id);
    function r(k, v) { return "<div><b>" + k + ":</b> " + U.esc(v || "—") + "</div>"; }
    var aidTbl = aid.length ?
      "<h2>المساعدات الممنوحة</h2><table><tr><th>التاريخ</th><th>النوع</th><th>المناسبة</th><th>المقدار</th></tr>" +
      aid.map(function (a) { return "<tr><td>" + U.fmtDate(a.date) + "</td><td>" + U.esc(a.type) + "</td><td>" + U.esc(a.occasion || "—") + "</td><td>" + U.fmtMoney(a.amount) + "</td></tr>"; }).join("") + "</table>" : "";

    var html =
      "<h2>بطاقة الحالة الاجتماعية — رقم الملف: " + U.esc(b.fileNo || "—") + "</h2>" +
      '<div class="kv">' +
        r("الاسم واللقب", fullName(b)) + r("ب.ت.و", b.cin) +
        r("تاريخ ومكان الولادة", U.fmtDate(b.dob) + " — " + (b.birthPlace || "")) + r("الهاتف", b.phone) +
        r("الحالة العائلية", b.marital) + r("عدد الأفراد", b.members || "—") +
        r("نوع العائلة", b.familyType) + r("صنف الحالة", b.category) +
        r("الضمان الاجتماعي", b.ssn) + r("صلوحية البطاقة", b.cardExpiry ? U.fmtDate(b.cardExpiry) : "—") +
        r("التغطية الاجتماعية", b.coverage) + r("الحالة الصحية", [b.chronic ? "مرض مزمن (" + (b.chronicType || "") + ")" : "", b.disabled ? "إعاقة (" + (b.disabilityType || "") + ")" : "", b.pension ? "ينتفع بجراية" : ""].filter(Boolean).join("، ") || "عادية") +
        r("العمل", b.work) + r("تقدير الدخل", b.income ? U.fmtMoney(b.income) : "—") +
        r("السكن", b.housing + (b.rent ? " — كراء " + U.fmtMoney(b.rent) : "")) + r("العنوان", (b.address || "") + " " + (b.postal || "")) +
      "</div>" +
      (b.notes ? "<h2>توصيف الحالة</h2><p>" + U.esc(b.notes) + "</p>" : "") +
      aidTbl +
      '<div class="sign"><div><div class="line">إمضاء العون المكلّف</div></div><div><div class="line">إمضاء رئيس اللجنة الاجتماعية</div></div></div>';

    U.printHTML("بطاقة حالة اجتماعية — " + fullName(b), html);
  }

  App.beneficiaryFullName = fullName;
})(window);

</script>
  <script>
/* =================================================================
   members.js — المنتفعون (الأفراد المستقلّون)
   أفراد مستقلّون تماماً، غير مرتبطين بأي عائلة، ولهم نفس حقول استمارة
   العائلة بالضبط (معطيات شخصية، ضمان، وضعية عائلية، حالة صحية،
   وضعية مادية ودراسة، سكن، ملف).
   ================================================================= */
(function (global) {
  "use strict";
  var App = global.App || (global.App = { views: {} });
  App.views = App.views || {};

  var COLL = "members";

  /* نفس قوائم اختيار استمارة العائلة بالضبط */
  var MARITAL = ["أعزب / عزباء", "متزوّج(ة)", "مطلّق(ة)", "أرمل(ة)"];
  var FAMILY_TYPE = ["عادية", "أيتام", "أرملة معيلة", "مُسنّ بمفرده", "ذو إعاقة", "أخرى"];
  var CATEGORY = ["قارة", "ظرفية", "عاجلة"];
  var WORK = ["موظّف(ة)", "عامل(ة) مرسم", "عامل(ة) غير مرسم", "عاطل عن العمل", "متقاعد(ة)", "ربّة بيت"];
  var HOUSING = ["ملك خاص", "إيجار", "تكفّل (مأوى)", "دائر / متنقّل"];
  var COVERAGE = ["ضمان اجتماعي", "تعريفة منخفضة (أصفر)", "علاج مجاني (أبيض)", "بدون تغطية", "متقاعد"];

  function fullName(m) {
    return ([m.firstName, m.lastName].filter(Boolean).join(" ") || "منتفع") + (m.nickname ? " (" + m.nickname + ")" : "");
  }
  /* ملخّص الحالة الصحية (مع التوافق مع السجلّات المُرحَّلة التي تحمل الحقل القديم health) */
  function healthSummary(m) {
    var bits = [];
    if (m.chronic) bits.push("مرض مزمن" + (m.chronicType ? " (" + m.chronicType + ")" : ""));
    if (m.disabled) bits.push("إعاقة" + (m.disabilityType ? " (" + m.disabilityType + ")" : ""));
    if (m.pension) bits.push("ينتفع بجراية");
    if (bits.length) return bits.join("، ");
    return m.health || "عادية";
  }
  function catTag(m) {
    var map = { "قارة": "green", "ظرفية": "amber", "عاجلة": "red" };
    return m.category ? '<span class="tag ' + (map[m.category] || "gray") + '">' + U.esc(m.category) + "</span>" : "—";
  }

  /* رقم ملف تلقائي تسلسلي للمنتفع: م-YYYY-NNN */
  function nextFileNo() {
    var year = new Date().getFullYear();
    var n = DB.all(COLL).reduce(function (mx, x) {
      var mt = (x.fileNo || "").match(/-(\d+)$/);
      return mt ? Math.max(mx, parseInt(mt[1], 10)) : mx;
    }, 0);
    return "م-" + year + "-" + ("000" + (n + 1)).slice(-3);
  }

  /* ============ القائمة ============ */
  App.views.members = function (container, params) {
    if (params && params.id) return detail(container, params.id);
    var state = { q: "", filter: "active" };

    function rows() {
      var list = DB.all(COLL).filter(function (m) { return state.filter === "archived" ? m.archived : !m.archived; });
      if (state.q) list = list.filter(function (m) {
        return U.match(m, state.q, ["firstName", "lastName", "nickname", "fileNo", "cin", "phone", "grade", "work", "marital", "address"]);
      });
      list.sort(function (a, b) { return (b.createdAt || "").localeCompare(a.createdAt || ""); });
      return list;
    }

    function paint() {
      var list = rows();
      var body;
      if (!list.length) {
        body = '<div class="empty"><div class="e-ico">👤</div><h4>لا يوجد منتفعون مسجّلون</h4>' +
          '<p>اضغط «إضافة منتفع» لإدراج فرد مستقلّ.</p></div>';
      } else {
        var tr = list.map(function (m) {
          return "<tr>" +
            '<td><span class="tag gray">' + U.esc(m.fileNo || "—") + "</span></td>" +
            '<td><a href="#" data-open="' + m.id + '" style="font-weight:800">' + U.esc(fullName(m)) + "</a></td>" +
            "<td>" + U.esc(m.phone || "—") + "</td>" +
            "<td>" + U.esc(m.marital || "—") + "</td>" +
            '<td style="text-align:center">' + (m.dob && U.age(m.dob) !== "" ? U.age(m.dob) + " سنة" : "—") + "</td>" +
            "<td>" + catTag(m) + "</td>" +
            "<td>" + U.esc(healthSummary(m)) + "</td>" +
            '<td><div class="t-actions">' +
              '<button class="icon-btn" data-open="' + m.id + '" title="عرض">👁️</button>' +
              '<button class="icon-btn" data-edit="' + m.id + '" title="تعديل">✏️</button>' +
              '<button class="icon-btn" data-print="' + m.id + '" title="طباعة">🖨️</button>' +
              '<button class="icon-btn" data-arch="' + m.id + '" title="' + (m.archived ? "استرجاع" : "أرشفة") + '">' + (m.archived ? "♻️" : "📥") + "</button>" +
              '<button class="icon-btn danger" data-del="' + m.id + '" title="حذف">🗑️</button>' +
            "</div></td></tr>";
        }).join("");
        body = '<div class="table-wrap"><table><thead><tr>' +
          "<th>رقم الملف</th><th>الاسم واللقب</th><th>الهاتف</th><th>الحالة العائلية</th><th>العمر</th><th>الصنف</th><th>الحالة الصحية</th><th>إجراءات</th>" +
          "</tr></thead><tbody>" + tr + "</tbody></table></div>";
      }

      container.innerHTML =
        '<div class="toolbar no-print">' +
          '<div class="search"><span class="si">🔍</span><input id="mSearch" placeholder="بحث بالاسم، رقم الملف، الهاتف، ب.ت.و…" value="' + U.esc(state.q) + '"></div>' +
          '<div class="filter-pills">' +
            '<button class="pill ' + (state.filter === "active" ? "active" : "") + '" data-flt="active">النشطون</button>' +
            '<button class="pill ' + (state.filter === "archived" ? "active" : "") + '" data-flt="archived">الأرشيف</button>' +
          "</div><div class='spacer' style='flex:1'></div>" +
          '<button class="btn secondary" id="mPrintList"><span class="ico">🖨️</span> طباعة القائمة</button>' +
          '<button class="btn secondary" id="mExport"><span class="ico">⬇️</span> تصدير Excel</button>' +
          '<button class="btn" id="mAdd"><span class="ico">＋</span> إضافة منتفع</button>' +
        "</div>" + body;

      var srch = document.getElementById("mSearch");
      srch.oninput = U.debounce(function () { state.q = srch.value; paint(); var n = document.getElementById("mSearch"); if (n) { n.focus(); n.selectionStart = n.value.length; } }, 180);
      document.getElementById("mAdd").onclick = function () { App.memberForm(null, paint); };
      document.getElementById("mExport").onclick = exportCSV;
      document.getElementById("mPrintList").onclick = function () {
        var l = rows();
        if (!l.length) return U.toast("لا توجد بيانات للطباعة", "info");
        U.printTable("قائمة المنتفعين", ["رقم الملف", "الاسم واللقب", "الهاتف", "الحالة العائلية", "العمر", "الصنف", "الحالة الصحية"],
          l.map(function (m) {
            return [m.fileNo || "—", fullName(m), m.phone || "—", m.marital || "—",
              (m.dob && U.age(m.dob) !== "" ? U.age(m.dob) + " سنة" : "—"), m.category || "—", healthSummary(m)];
          }), { subtitle: state.filter === "archived" ? "الأرشيف" : "النشطون" });
      };
      container.querySelectorAll("[data-flt]").forEach(function (el) {
        el.onclick = function () { state.filter = el.getAttribute("data-flt"); state.q = ""; paint(); };
      });
      container.querySelectorAll("[data-open]").forEach(function (el) {
        el.onclick = function (e) { e.preventDefault(); App.navigate("members", { id: el.getAttribute("data-open") }); };
      });
      container.querySelectorAll("[data-edit]").forEach(function (el) {
        el.onclick = function () { App.memberForm(el.getAttribute("data-edit"), paint); };
      });
      container.querySelectorAll("[data-print]").forEach(function (el) {
        el.onclick = function () { printMember(el.getAttribute("data-print")); };
      });
      container.querySelectorAll("[data-arch]").forEach(function (el) {
        el.onclick = function () {
          var m = DB.get(COLL, el.getAttribute("data-arch"));
          DB.setArchived(COLL, m.id, !m.archived);
          U.toast(m.archived ? "تمت إعادة المنتفع للنشطين" : "تمت أرشفة المنتفع"); paint();
        };
      });
      container.querySelectorAll("[data-del]").forEach(function (el) {
        el.onclick = function () {
          var m = DB.get(COLL, el.getAttribute("data-del"));
          U.confirm({ title: "حذف المنتفع", danger: true, message: "حذف «" + fullName(m) + "» نهائياً؟ لا يمكن التراجع.", okText: "حذف نهائي",
            onOk: function () { DB.remove(COLL, m.id); U.toast("تم الحذف", "info"); paint(); } });
        };
      });
    }

    function exportCSV() {
      var list = rows();
      if (!list.length) return U.toast("لا توجد بيانات للتصدير", "info");
      var headers = [
        { label: "رقم الملف", key: "fileNo" },
        { label: "الاسم", key: "firstName" }, { label: "اللقب", key: "lastName" }, { label: "الكنية", key: "nickname" },
        { label: "ب.ت.و", key: "cin" }, { label: "تاريخ الولادة", key: "dob" },
        { label: "العمر", get: function (m) { return m.dob ? U.age(m.dob) : ""; } },
        { label: "مكان الولادة", key: "birthPlace" }, { label: "الهاتف", key: "phone" },
        { label: "رقم الضمان", key: "ssn" }, { label: "التغطية الاجتماعية", key: "coverage" },
        { label: "الحالة العائلية", key: "marital" }, { label: "نوع العائلة", key: "familyType" },
        { label: "صنف الحالة", key: "category" },
        { label: "الحالة الصحية", get: healthSummary },
        { label: "المستوى الدراسي", key: "grade" }, { label: "العمل", key: "work" },
        { label: "تقدير الدخل", key: "income" }, { label: "السكن", key: "housing" }, { label: "العنوان", key: "address" }
      ];
      U.download("المنتفعون-" + U.today() + ".csv", U.toCSV(list, headers), "text/csv");
      U.toast("تم تصدير ملف Excel (CSV)");
    }

    paint();
  };

  /* ============ التفاصيل ============ */
  function detail(container, id) {
    var m = DB.get(COLL, id);
    if (!m) { container.innerHTML = '<div class="empty"><div class="e-ico">❓</div><h4>المنتفع غير موجود</h4></div>'; return; }
    function info(k, v) { return '<div class="info-item"><div class="k">' + k + '</div><div class="v">' + (v || "—") + "</div></div>"; }

    var healthBits = [];
    if (m.chronic) healthBits.push('<span class="tag amber">مرض مزمن: ' + U.esc(m.chronicType || "غير محدّد") + "</span>");
    if (m.disabled) healthBits.push('<span class="tag red">إعاقة: ' + U.esc(m.disabilityType || "غير محدّد") + "</span>");
    if (m.pension) healthBits.push('<span class="tag green">ينتفع بجراية</span>');
    if (!healthBits.length) healthBits.push('<span class="tag gray">' + U.esc(m.health || "لا يوجد") + "</span>");

    container.innerHTML =
      '<div class="toolbar no-print">' +
        '<button class="btn ghost" id="mBack">→ رجوع للقائمة</button><div class="spacer" style="flex:1"></div>' +
        '<button class="btn secondary" id="mPrint"><span class="ico">🖨️</span> طباعة البطاقة</button>' +
        '<button class="btn" id="mEdit"><span class="ico">✏️</span> تعديل</button>' +
      "</div>" +
      '<div class="detail-grid">' +
        '<div class="card profile-card"><div class="card-body">' +
          '<div class="profile-avatar" style="background:linear-gradient(135deg,var(--gold-500),var(--gold-600))">' + U.esc(U.initials(m.firstName, m.lastName)) + "</div>" +
          '<div class="pname">' + U.esc(fullName(m)) + "</div>" +
          '<div class="pfile">رقم الملف: ' + U.esc(m.fileNo || "—") + "</div>" +
          '<div style="margin-top:10px">' + catTag(m) +
            (m.familyType ? ' <span class="tag blue">' + U.esc(m.familyType) + "</span>" : "") +
            (m.archived ? ' <span class="tag gray">مؤرشف</span>' : "") + "</div>" +
          '<div style="margin-top:16px;border-top:1px solid var(--line);padding-top:14px;text-align:right"><div class="info-list one">' +
            info("الهاتف", U.esc(m.phone)) +
            info("ب.ت.و", U.esc(m.cin)) +
            info("تاريخ الولادة", m.dob ? U.fmtDate(m.dob) + (U.age(m.dob) !== "" ? " (" + U.age(m.dob) + " سنة)" : "") : "—") +
            info("مكان الولادة", U.esc(m.birthPlace)) +
            info("العنوان", U.esc(m.address) + (m.postal ? " — " + U.esc(m.postal) : "")) +
          "</div></div>" +
        "</div></div>" +
        "<div>" +
          '<div class="card mb-16"><div class="card-head"><h3>👤 الوضعية العائلية والصحية</h3></div><div class="card-body"><div class="info-list">' +
            info("الحالة العائلية", U.esc(m.marital)) +
            info("نوع العائلة", U.esc(m.familyType)) +
            info("صنف الحالة", U.esc(m.category)) +
            info("عدد الأفراد", m.members ? U.fmtNum(m.members) : "—") +
            info("الحالة الصحية", healthBits.join(" ")) +
            info("الضمان الاجتماعي", U.esc(m.ssn) + (m.cardExpiry ? " — صلوحية: " + U.fmtDate(m.cardExpiry) : "")) +
            info("التغطية الاجتماعية", U.esc(m.coverage)) +
          "</div></div></div>" +
          '<div class="card"><div class="card-head"><h3>💼 الوضعية المادية والسكن والدراسة</h3></div><div class="card-body"><div class="info-list">' +
            info("المستوى الدراسي", U.esc(m.grade)) +
            info("العمل", U.esc(m.work)) +
            info("تقدير الدخل الشهري", m.income ? U.fmtMoney(m.income) : "—") +
            info("مداخيل أخرى", U.esc(m.otherIncome)) +
            info("نوع السكن", U.esc(m.housing) + (m.rent ? " — كراء: " + U.fmtMoney(m.rent) : "")) +
            info("العون المكلّف", U.esc(m.agent)) +
            info("تاريخ الإدماج", m.joinDate ? U.fmtDate(m.joinDate) : U.fmtDate(m.createdAt)) +
          "</div>" +
          (m.notes ? '<div style="margin-top:12px"><div class="k" style="font-size:12px;color:var(--muted);font-weight:700">توصيف الحالة</div><div>' + U.esc(m.notes) + "</div></div>" : "") +
          "</div></div>" +
        "</div>" +
      "</div>";

    document.getElementById("mBack").onclick = function () { App.navigate("members"); };
    document.getElementById("mPrint").onclick = function () { printMember(id); };
    document.getElementById("mEdit").onclick = function () { App.memberForm(id, function () { detail(container, id); }); };
  }

  /* ============ النموذج (نفس حقول استمارة العائلة بالضبط) ============ */
  function chip(name, val, current) {
    return '<label class="radio-chip"><input type="radio" data-f="' + name + '" name="' + name + '" value="' + U.esc(val) + '"' +
      (current === val ? " checked" : "") + '><span>' + U.esc(val) + "</span></label>";
  }

  App.memberForm = function (id, after) {
    var m = id ? DB.get(COLL, id) : {};
    var isNew = !id;

    function opts(list, sel) {
      return '<option value="">— اختر —</option>' + list.map(function (o) {
        return '<option' + (sel === o ? " selected" : "") + ">" + U.esc(o) + "</option>";
      }).join("");
    }

    var body =
      '<div class="form-grid">' +
        '<div class="field"><label>رقم الملف</label><input data-f="fileNo" value="' + U.esc(m.fileNo || nextFileNo()) + '"></div>' +
        '<div class="field"><label>العون المكلّف بالمسك</label><input data-f="agent" value="' + U.esc(m.agent || "") + '" placeholder="اسم العون"></div>' +
      "</div>" +

      '<fieldset class="fieldset"><legend>① المعطيات الشخصية</legend><div class="form-grid">' +
        '<div class="field"><label>الاسم <span class="req">*</span></label><input data-f="firstName" value="' + U.esc(m.firstName || "") + '" required></div>' +
        '<div class="field"><label>اللقب</label><input data-f="lastName" value="' + U.esc(m.lastName || "") + '"></div>' +
        '<div class="field"><label>الكنية</label><input data-f="nickname" value="' + U.esc(m.nickname || "") + '" placeholder="إن وُجدت عند تشابه الأسماء"></div>' +
        '<div class="field"><label>رقم ب.ت.و</label><input data-f="cin" value="' + U.esc(m.cin || "") + '" inputmode="numeric"></div>' +
        '<div class="field"><label>تاريخ الولادة</label><input type="date" data-f="dob" value="' + U.esc(m.dob || "") + '"></div>' +
        '<div class="field"><label>مكان الولادة</label><input data-f="birthPlace" value="' + U.esc(m.birthPlace || "") + '"></div>' +
        '<div class="field"><label>الهاتف</label><input data-f="phone" value="' + U.esc(m.phone || "") + '" inputmode="tel"></div>' +
      "</div></fieldset>" +

      '<fieldset class="fieldset"><legend>② الضمان والتغطية الاجتماعية</legend><div class="form-grid">' +
        '<div class="field"><label>رقم الضمان الاجتماعي</label><input data-f="ssn" value="' + U.esc(m.ssn || "") + '"></div>' +
        '<div class="field"><label>صلوحية البطاقة (تاريخ الانتهاء)</label><input type="date" data-f="cardExpiry" value="' + U.esc(m.cardExpiry || "") + '"></div>' +
        '<div class="field full"><label>نوع التغطية الاجتماعية</label><select data-f="coverage">' + opts(COVERAGE, m.coverage) + "</select></div>" +
      "</div></fieldset>" +

      '<fieldset class="fieldset"><legend>③ الوضعية العائلية</legend>' +
        '<div class="field"><label>الحالة العائلية</label><div class="radio-row">' + MARITAL.map(function (x) { return chip("marital", x, m.marital); }).join("") + "</div></div>" +
        '<div class="form-grid" style="margin-top:12px">' +
          '<div class="field"><label>نوع العائلة</label><select data-f="familyType">' + opts(FAMILY_TYPE, m.familyType) + "</select></div>" +
          '<div class="field"><label>صنف الحالة (الأولوية)</label><select data-f="category">' + opts(CATEGORY, m.category) + "</select></div>" +
          '<div class="field"><label>عدد الأفراد</label><input type="number" min="1" data-f="members" value="' + U.esc(m.members || "") + '"></div>' +
        "</div>" +
      "</fieldset>" +

      '<fieldset class="fieldset"><legend>④ الحالة الصحية</legend>' +
        '<div class="form-grid">' +
          '<div class="field"><label class="check-inline"><input type="checkbox" data-f="chronic" id="chk_chronic"' + (m.chronic ? " checked" : "") + "> مريض مزمن</label>" +
            '<input data-f="chronicType" placeholder="نوع المرض: سكري، ضغط، تنفّس…" value="' + U.esc(m.chronicType || "") + '"></div>' +
          '<div class="field"><label class="check-inline"><input type="checkbox" data-f="disabled" id="chk_dis"' + (m.disabled ? " checked" : "") + "> ذو إعاقة</label>" +
            '<input data-f="disabilityType" placeholder="نوع الإعاقة" value="' + U.esc(m.disabilityType || "") + '"></div>' +
          '<div class="field full"><label class="check-inline"><input type="checkbox" data-f="pension"' + (m.pension ? " checked" : "") + "> ينتفع بجراية (منحة)</label></div>" +
        "</div>" +
      "</fieldset>" +

      '<fieldset class="fieldset"><legend>⑤ الوضعية المادية والدراسة</legend><div class="form-grid">' +
        '<div class="field"><label>المستوى الدراسي</label><input data-f="grade" value="' + U.esc(m.grade || "") + '" placeholder="تلميذ/سنة…"></div>' +
        '<div class="field"><label>العمل / المهنة</label><select data-f="work">' + opts(WORK, m.work) + "</select></div>" +
        '<div class="field"><label>تقدير الدخل الشهري</label><input type="number" step="0.001" min="0" data-f="income" value="' + U.esc(m.income || "") + '"></div>' +
        '<div class="field full"><label>مداخيل أخرى</label><input data-f="otherIncome" value="' + U.esc(m.otherIncome || "") + '" placeholder="مصدر ومقدار المداخيل الأخرى"></div>' +
      "</div></fieldset>" +

      '<fieldset class="fieldset"><legend>⑥ السكن والعنوان</legend><div class="form-grid">' +
        '<div class="field full"><label>العنوان</label><input data-f="address" value="' + U.esc(m.address || "") + '"></div>' +
        '<div class="field"><label>الترقيم البريدي</label><input data-f="postal" value="' + U.esc(m.postal || "") + '" inputmode="numeric"></div>' +
        '<div class="field"><label>نوع المسكن</label><select data-f="housing" id="housingSel">' + opts(HOUSING, m.housing) + "</select></div>" +
        '<div class="field full" id="rentWrap" style="display:none"><label>تقدير ثمن الكراء (شهرياً)</label><input type="number" step="0.001" min="0" data-f="rent" value="' + U.esc(m.rent || "") + '"></div>' +
      "</div></fieldset>" +

      '<fieldset class="fieldset"><legend>⑦ الملف</legend><div class="form-grid">' +
        '<div class="field"><label>تاريخ الإدماج / التحيين</label><input type="date" data-f="joinDate" value="' + U.esc(m.joinDate || U.today()) + '"></div>' +
        '<div class="field full"><label>توصيف الحالة</label><textarea data-f="notes" placeholder="وصف موجز للحالة والاحتياجات">' + U.esc(m.notes || "") + "</textarea></div>" +
      "</div></fieldset>";

    U.openModal({
      title: isNew ? "إضافة منتفع" : "تعديل المنتفع: " + fullName(m),
      wide: true,
      body: body,
      footer: '<button class="btn" id="mSave"><span class="ico">💾</span> حفظ</button><button class="btn secondary" id="mCancel">إلغاء</button>',
      onOpen: function (root) {
        var hs = root.querySelector("#housingSel"), rentWrap = root.querySelector("#rentWrap");
        function toggleRent() { rentWrap.style.display = hs.value === "إيجار" ? "" : "none"; }
        hs.onchange = toggleRent; toggleRent();

        root.querySelector("#mCancel").onclick = U.closeModal;
        root.querySelector("#mSave").onclick = function () {
          var data = U.formData(root);
          if (!data.firstName) { U.toast("الاسم إجباري", "error"); return; }
          if (isNew) { DB.insert(COLL, data); U.toast("تمت إضافة المنتفع"); }
          else { DB.update(COLL, id, data); U.toast("تم تحديث المنتفع"); }
          U.closeModal();
          after && after();
        };
      }
    });
  };

  /* ============ طباعة بطاقة المنتفع ============ */
  function printMember(id) {
    var m = DB.get(COLL, id);
    if (!m) return;
    function r(k, v) { return "<div><b>" + k + ":</b> " + U.esc(v || "—") + "</div>"; }
    var html =
      "<h2>بطاقة منتفع — رقم الملف: " + U.esc(m.fileNo || "—") + "</h2>" +
      '<div class="kv">' +
        r("الاسم واللقب", fullName(m)) + r("ب.ت.و", m.cin) +
        r("تاريخ ومكان الولادة", U.fmtDate(m.dob) + " — " + (m.birthPlace || "")) + r("الهاتف", m.phone) +
        r("الحالة العائلية", m.marital) + r("نوع العائلة", m.familyType) +
        r("صنف الحالة", m.category) + r("الضمان الاجتماعي", m.ssn) +
        r("صلوحية البطاقة", m.cardExpiry ? U.fmtDate(m.cardExpiry) : "—") + r("التغطية الاجتماعية", m.coverage) +
        r("الحالة الصحية", healthSummary(m)) + r("المستوى الدراسي", m.grade) +
        r("العمل", m.work) + r("تقدير الدخل", m.income ? U.fmtMoney(m.income) : "—") +
        r("السكن", (m.housing || "") + (m.rent ? " — كراء " + U.fmtMoney(m.rent) : "")) + r("العنوان", (m.address || "") + " " + (m.postal || "")) +
      "</div>" +
      (m.notes ? "<h2>توصيف الحالة</h2><p>" + U.esc(m.notes) + "</p>" : "") +
      '<div class="sign"><div><div class="line">إمضاء العون المكلّف</div></div><div><div class="line">إمضاء رئيس اللجنة</div></div></div>';
    U.printHTML("بطاقة منتفع — " + fullName(m), html);
  }

  App.memberFullName = fullName;
})(window);

</script>
  <script>
/* =================================================================
   donors.js — المتبرعون وتبرعاتهم
   ================================================================= */
(function (global) {
  "use strict";
  var App = global.App || (global.App = { views: {} });
  App.views = App.views || {};

  var COLL = "donors";
  var DON = "donations";
  var DONOR_TYPE = ["فرد", "عائلة", "مؤسسة / شركة", "جمعية", "محسن مجهول"];
  var AID_KINDS = ["مالي", "عيني (مواد غذائية)", "ملابس", "أدوية", "أضحية", "كسوة العيد", "قفّة رمضان", "أخرى"];

  function fullName(d) { return [d.firstName, d.lastName].filter(Boolean).join(" ") || "متبرّع"; }
  function donorTotal(id) { return DB.where(DON, "donorId", id).reduce(function (s, x) { return s + (parseFloat(x.amount) || 0); }, 0); }

  /* ============ القائمة ============ */
  App.views.donors = function (container, params) {
    if (params && params.id) return detail(container, params.id);
    var state = { q: "", filter: "active" };

    function rows() {
      var list = DB.all(COLL).filter(function (d) { return state.filter === "archived" ? d.archived : !d.archived; });
      if (state.q) list = list.filter(function (d) { return U.match(d, state.q, ["firstName", "lastName", "phone", "type"]); });
      list.sort(function (a, b) { return (b.createdAt || "").localeCompare(a.createdAt || ""); });
      return list;
    }

    function paint() {
      var list = rows();
      var body;
      if (!list.length) {
        body = '<div class="empty"><div class="e-ico">🤝</div><h4>لا يوجد متبرعون مسجّلون</h4><p>اضغط «إضافة متبرّع» للبدء.</p></div>';
      } else {
        var tr = list.map(function (d) {
          var dons = DB.where(DON, "donorId", d.id);
          var last = dons.sort(function (a, b) { return (b.date || "").localeCompare(a.date || ""); })[0];
          return "<tr>" +
            '<td><a href="#" data-open="' + d.id + '" style="font-weight:800">' + U.esc(fullName(d)) + "</a></td>" +
            '<td><span class="tag blue">' + U.esc(d.type || "فرد") + "</span></td>" +
            "<td>" + U.esc(d.phone || "—") + "</td>" +
            '<td style="text-align:center">' + dons.length + "</td>" +
            '<td class="money in">' + U.fmtMoney(donorTotal(d.id)) + "</td>" +
            "<td>" + (last ? U.fmtDate(last.date) : "—") + "</td>" +
            '<td><div class="t-actions">' +
              '<button class="icon-btn" data-open="' + d.id + '" title="عرض">👁️</button>' +
              '<button class="icon-btn" data-edit="' + d.id + '" title="تعديل">✏️</button>' +
              '<button class="icon-btn" data-arch="' + d.id + '" title="' + (d.archived ? "استرجاع" : "أرشفة") + '">' + (d.archived ? "♻️" : "📥") + "</button>" +
              '<button class="icon-btn danger" data-del="' + d.id + '" title="حذف">🗑️</button>' +
            "</div></td></tr>";
        }).join("");
        body = '<div class="table-wrap"><table><thead><tr><th>الاسم واللقب</th><th>الصفة</th><th>الهاتف</th><th>عدد التبرعات</th><th>مجموع التبرعات</th><th>آخر تبرّع</th><th>إجراءات</th></tr></thead><tbody>' + tr + "</tbody></table></div>";
      }

      container.innerHTML =
        '<div class="toolbar no-print">' +
          '<div class="search"><span class="si">🔍</span><input id="dSearch" placeholder="بحث باسم المتبرّع أو الهاتف…" value="' + U.esc(state.q) + '"></div>' +
          '<div class="filter-pills"><button class="pill ' + (state.filter === "active" ? "active" : "") + '" data-flt="active">النشطون</button>' +
          '<button class="pill ' + (state.filter === "archived" ? "active" : "") + '" data-flt="archived">الأرشيف</button></div>' +
          '<div class="spacer" style="flex:1"></div>' +
          '<button class="btn secondary" id="dPrintList"><span class="ico">🖨️</span> طباعة القائمة</button>' +
          '<button class="btn secondary" id="dExport"><span class="ico">⬇️</span> تصدير</button>' +
          '<button class="btn" id="dAdd"><span class="ico">＋</span> إضافة متبرّع</button>' +
        "</div>" + body;

      var s = document.getElementById("dSearch");
      s.oninput = U.debounce(function () { state.q = s.value; paint(); var n = document.getElementById("dSearch"); if (n) { n.focus(); n.selectionStart = n.value.length; } }, 180);
      document.getElementById("dAdd").onclick = function () { openForm(null, paint); };
      document.getElementById("dExport").onclick = function () {
        if (!list.length) return U.toast("لا توجد بيانات", "info");
        var headers = [{ label: "الاسم", key: "firstName" }, { label: "اللقب", key: "lastName" }, { label: "الصفة", key: "type" },
          { label: "الهاتف", key: "phone" }, { label: "عدد التبرعات", get: function (d) { return DB.where(DON, "donorId", d.id).length; } },
          { label: "مجموع التبرعات", get: function (d) { return donorTotal(d.id); } }];
        U.download("المتبرعون-" + U.today() + ".csv", U.toCSV(list, headers), "text/csv"); U.toast("تم التصدير");
      };
      document.getElementById("dPrintList").onclick = function () {
        if (!list.length) return U.toast("لا توجد بيانات للطباعة", "info");
        U.printTable("قائمة المتبرّعين", ["الاسم واللقب", "الصفة", "الهاتف", "عدد التبرعات", "مجموع التبرعات"],
          list.map(function (d) {
            return [fullName(d), d.type || "فرد", d.phone || "—", DB.where(DON, "donorId", d.id).length, U.fmtMoney(donorTotal(d.id))];
          }), { subtitle: state.filter === "archived" ? "الأرشيف" : "النشطون" });
      };
      container.querySelectorAll("[data-flt]").forEach(function (el) { el.onclick = function () { state.filter = el.getAttribute("data-flt"); paint(); }; });
      container.querySelectorAll("[data-open]").forEach(function (el) { el.onclick = function (e) { e.preventDefault(); App.navigate("donors", { id: el.getAttribute("data-open") }); }; });
      container.querySelectorAll("[data-edit]").forEach(function (el) { el.onclick = function () { openForm(el.getAttribute("data-edit"), paint); }; });
      container.querySelectorAll("[data-arch]").forEach(function (el) {
        el.onclick = function () { var d = DB.get(COLL, el.getAttribute("data-arch")); DB.setArchived(COLL, d.id, !d.archived); U.toast(d.archived ? "تمت الإعادة" : "تمت الأرشفة"); paint(); };
      });
      container.querySelectorAll("[data-del]").forEach(function (el) {
        el.onclick = function () {
          var d = DB.get(COLL, el.getAttribute("data-del"));
          U.confirm({ title: "حذف المتبرّع", danger: true, message: "حذف «" + fullName(d) + "» وكل تبرعاته نهائياً؟", okText: "حذف نهائي",
            onOk: function () { DB.where(DON, "donorId", d.id).forEach(function (x) { DB.remove(DON, x.id); }); DB.remove(COLL, d.id); U.toast("تم الحذف", "info"); paint(); } });
        };
      });
    }
    paint();
  };

  /* ============ التفاصيل ============ */
  function detail(container, id) {
    function paint() {
      var d = DB.get(COLL, id);
      if (!d) { container.innerHTML = '<div class="empty"><div class="e-ico">❓</div><h4>المتبرّع غير موجود</h4></div>'; return; }
      var dons = DB.where(DON, "donorId", id).sort(function (a, b) { return (b.date || "").localeCompare(a.date || ""); });
      var total = donorTotal(id);
      var rows = dons.length ? dons.map(function (x) {
        return "<tr><td>" + U.fmtDate(x.date) + "</td><td>" + U.esc(x.type || "—") + "</td><td>" + U.esc(x.occasion || "—") +
          '</td><td class="money in">' + U.fmtMoney(x.amount) + '</td><td><div class="t-actions">' +
          '<button class="icon-btn" data-dedit="' + x.id + '">✏️</button><button class="icon-btn danger" data-ddel="' + x.id + '">🗑️</button></div></td></tr>';
      }).join("") : '<tr><td colspan="5" class="muted" style="text-align:center;padding:22px">لا توجد تبرّعات مسجّلة بعد</td></tr>';

      container.innerHTML =
        '<div class="toolbar no-print"><button class="btn ghost" id="dBack">→ رجوع</button><div class="spacer" style="flex:1"></div>' +
          '<button class="btn secondary" id="dPrint"><span class="ico">🖨️</span> طباعة</button>' +
          '<button class="btn" id="dEdit"><span class="ico">✏️</span> تعديل</button></div>' +
        '<div class="detail-grid">' +
          '<div class="card profile-card"><div class="card-body">' +
            '<div class="profile-avatar" style="background:linear-gradient(135deg,var(--gold-500),var(--gold-600))">' + U.esc(U.initials(d.firstName, d.lastName)) + "</div>" +
            '<div class="pname">' + U.esc(fullName(d)) + '</div><div class="pfile">' + U.esc(d.type || "فرد") + "</div>" +
            '<div style="margin-top:16px;border-top:1px solid var(--line);padding-top:14px;text-align:right"><div class="info-list one">' +
              '<div class="info-item"><div class="k">الهاتف</div><div class="v">' + U.esc(d.phone || "—") + "</div></div>" +
              '<div class="info-item"><div class="k">العنوان</div><div class="v">' + U.esc(d.address || "—") + "</div></div>" +
              '<div class="info-item"><div class="k">مجموع التبرعات</div><div class="v money in">' + U.fmtMoney(total) + "</div></div>" +
              (d.notes ? '<div class="info-item"><div class="k">ملاحظات</div><div class="v">' + U.esc(d.notes) + "</div></div>" : "") +
            "</div></div></div></div>" +
          '<div class="card"><div class="card-head"><h3>🎁 سجلّ التبرعات</h3><div class="spacer"></div>' +
            '<button class="btn sm gold no-print" id="addDon"><span class="ico">＋</span> تسجيل تبرّع</button></div>' +
            '<div class="table-wrap" style="border:none;box-shadow:none;border-radius:0"><table><thead><tr><th>التاريخ</th><th>نوعية الإعانة</th><th>المناسبة</th><th>المقدار</th><th>إجراءات</th></tr></thead><tbody>' + rows + "</tbody></table></div></div>" +
        "</div>";

      document.getElementById("dBack").onclick = function () { App.navigate("donors"); };
      document.getElementById("dEdit").onclick = function () { openForm(id, paint); };
      document.getElementById("dPrint").onclick = function () { printDonor(id); };
      document.getElementById("addDon").onclick = function () { App.donationForm(id, paint); };
      container.querySelectorAll("[data-dedit]").forEach(function (el) { el.onclick = function () { App.donationForm(id, paint, el.getAttribute("data-dedit")); }; });
      container.querySelectorAll("[data-ddel]").forEach(function (el) {
        el.onclick = function () { U.confirm({ title: "حذف التبرّع", danger: true, message: "حذف سجلّ التبرّع؟", okText: "حذف",
          onOk: function () { DB.remove(DON, el.getAttribute("data-ddel")); U.toast("تم الحذف", "info"); paint(); } }); };
      });
    }
    paint();
  }

  /* ============ نموذج المتبرّع ============ */
  function openForm(id, after) {
    var d = id ? DB.get(COLL, id) : {};
    var isNew = !id;
    var typeOpts = DONOR_TYPE.map(function (t) { return '<option' + (d.type === t ? " selected" : "") + ">" + U.esc(t) + "</option>"; }).join("");
    U.openModal({
      title: isNew ? "إضافة متبرّع" : "تعديل المتبرّع",
      body: '<div class="form-grid">' +
        '<div class="field"><label>الاسم <span class="req">*</span></label><input data-f="firstName" value="' + U.esc(d.firstName || "") + '"></div>' +
        '<div class="field"><label>اللقب</label><input data-f="lastName" value="' + U.esc(d.lastName || "") + '"></div>' +
        '<div class="field"><label>الصفة</label><select data-f="type"><option value="">— اختر —</option>' + typeOpts + "</select></div>" +
        '<div class="field"><label>الهاتف</label><input data-f="phone" value="' + U.esc(d.phone || "") + '" inputmode="tel"></div>' +
        '<div class="field full"><label>العنوان</label><input data-f="address" value="' + U.esc(d.address || "") + '"></div>' +
        '<div class="field full"><label>ملاحظات</label><textarea data-f="notes">' + U.esc(d.notes || "") + "</textarea></div>" +
      "</div>",
      footer: '<button class="btn" id="dSave"><span class="ico">💾</span> حفظ</button><button class="btn secondary" id="dCancel">إلغاء</button>',
      onOpen: function (root) {
        root.querySelector("#dCancel").onclick = U.closeModal;
        root.querySelector("#dSave").onclick = function () {
          var data = U.formData(root);
          if (!data.firstName) { U.toast("الاسم إجباري", "error"); return; }
          if (isNew) { DB.insert(COLL, data); U.toast("تمت إضافة المتبرّع"); }
          else { DB.update(COLL, id, data); U.toast("تم التحديث"); }
          U.closeModal(); after && after();
        };
      }
    });
  }

  /* ============ نموذج التبرّع (مشترك) ============ */
  App.donationForm = function (donorId, after, donationId) {
    var x = donationId ? DB.get(DON, donationId) : {};
    var isNew = !donationId;
    // اختيار المتبرّع إن لم يُمرَّر
    var needPick = !donorId;
    var donorsList = DB.all(COLL).filter(function (d) { return !d.archived; });
    var pickHtml = needPick ? '<div class="field full"><label>المتبرّع <span class="req">*</span></label><select data-f="donorId"><option value="">— اختر المتبرّع —</option>' +
      donorsList.map(function (d) { return '<option value="' + d.id + '">' + U.esc(fullName(d)) + "</option>"; }).join("") + "</select></div>" : "";
    var kindOpts = AID_KINDS.map(function (k) { return '<option' + (x.type === k ? " selected" : "") + ">" + U.esc(k) + "</option>"; }).join("");

    U.openModal({
      title: isNew ? "تسجيل تبرّع جديد" : "تعديل التبرّع",
      body: '<div class="form-grid">' + pickHtml +
        '<div class="field"><label>التاريخ</label><input type="date" data-f="date" value="' + U.esc(x.date || U.today()) + '"></div>' +
        '<div class="field"><label>المقدار</label><input type="number" step="0.001" min="0" data-f="amount" value="' + U.esc(x.amount || "") + '"></div>' +
        '<div class="field"><label>نوعية الإعانة</label><select data-f="type"><option value="">— اختر —</option>' + kindOpts + "</select></div>" +
        '<div class="field"><label>المناسبة</label><input data-f="occasion" value="' + U.esc(x.occasion || "") + '" placeholder="رمضان، العيد، عاشوراء…"></div>' +
        '<div class="field full"><label>ملاحظة</label><input data-f="note" value="' + U.esc(x.note || "") + '"></div>' +
      "</div>",
      footer: '<button class="btn" id="xSave"><span class="ico">💾</span> حفظ</button><button class="btn secondary" id="xCancel">إلغاء</button>',
      onOpen: function (root) {
        root.querySelector("#xCancel").onclick = U.closeModal;
        root.querySelector("#xSave").onclick = function () {
          var data = U.formData(root);
          var did = donorId || data.donorId;
          if (!did) { U.toast("يُرجى اختيار المتبرّع", "error"); return; }
          if (!data.amount && !data.type) { U.toast("أدخل المقدار أو نوعية الإعانة", "error"); return; }
          data.donorId = did;
          if (isNew) { DB.insert(DON, data); U.toast("تم تسجيل التبرّع"); }
          else { DB.update(DON, donationId, data); U.toast("تم التحديث"); }
          U.closeModal(); after && after();
        };
      }
    });
  };

  function printDonor(id) {
    var d = DB.get(COLL, id);
    var dons = DB.where(DON, "donorId", id);
    var tbl = "<table><tr><th>التاريخ</th><th>النوع</th><th>المناسبة</th><th>المقدار</th></tr>" +
      dons.map(function (x) { return "<tr><td>" + U.fmtDate(x.date) + "</td><td>" + U.esc(x.type) + "</td><td>" + U.esc(x.occasion || "—") + "</td><td>" + U.fmtMoney(x.amount) + "</td></tr>"; }).join("") +
      '<tr><th colspan="3">المجموع</th><th>' + U.fmtMoney(donorTotal(id)) + "</th></tr></table>";
    U.printHTML("سجلّ تبرّعات — " + fullName(d),
      "<h2>المتبرّع: " + U.esc(fullName(d)) + "</h2><div class='kv'><div><b>الصفة:</b> " + U.esc(d.type || "—") + "</div><div><b>الهاتف:</b> " + U.esc(d.phone || "—") + "</div></div><h2>التبرعات</h2>" + tbl);
  }

  App.donorFullName = fullName;
})(window);
