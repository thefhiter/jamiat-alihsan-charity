  <script>
/* =================================================================
   ihsan.js — استمارة جمعية الإحسان (المنتفعون + المتبرّعون في سجلّ واحد)
   تطابق نموذج الاستمارة: قسم «المنتفعون» مستقلّ وقسم «المتبرّعون» مستقلّ.
   ================================================================= */
(function (global) {
  "use strict";
  var App = global.App || (global.App = { views: {} });
  App.views = App.views || {};

  var COLL = "ihsan";
  var AID_KINDS = ["مالي", "عيني (مواد غذائية)", "ملابس", "أدوية", "أضحية", "كسوة العيد", "قفّة رمضان", "أخرى"];

  function recTitle(r) {
    return [r.benFamily, r.donorName].filter(Boolean).join(" / ") || "استمارة الإحسان";
  }

  /* ============ القائمة ============ */
  App.views.ihsan = function (container, params) {
    if (params && params.id) return detail(container, params.id);
    var state = { q: "", filter: "active" };

    function rows() {
      var list = DB.all(COLL).filter(function (r) { return state.filter === "archived" ? r.archived : !r.archived; });
      if (state.q) list = list.filter(function (r) {
        return U.match(r, state.q, ["benFamily", "benAidType", "benOccasion", "donorName", "donorLastName", "donorAidType"]);
      });
      list.sort(function (a, b) { return (b.createdAt || "").localeCompare(a.createdAt || ""); });
      return list;
    }

    function paint() {
      var list = rows();
      var body;
      if (!list.length) {
        body = '<div class="empty"><div class="e-ico">📋</div><h4>لا توجد استمارات مسجّلة</h4>' +
          '<p>اضغط «إضافة استمارة» لإدراج أوّل سجلّ إحسان.</p></div>';
      } else {
        var tr = list.map(function (r) {
          return "<tr>" +
            '<td><a href="#" data-open="' + r.id + '" style="font-weight:800">' + U.esc(r.benFamily || "—") + "</a></td>" +
            "<td>" + U.fmtDate(r.benDate) + "</td>" +
            '<td class="money out">' + (r.benAmount ? U.fmtMoney(r.benAmount) : "—") + "</td>" +
            "<td>" + U.esc(r.benAidType || "—") + "</td>" +
            "<td>" + U.esc([r.donorName, r.donorLastName].filter(Boolean).join(" ") || "—") + "</td>" +
            '<td class="money in">' + (r.donorAmount ? U.fmtMoney(r.donorAmount) : "—") + "</td>" +
            '<td><div class="t-actions">' +
              '<button class="icon-btn" data-open="' + r.id + '" title="عرض">👁️</button>' +
              '<button class="icon-btn" data-edit="' + r.id + '" title="تعديل">✏️</button>' +
              '<button class="icon-btn" data-print="' + r.id + '" title="طباعة">🖨️</button>' +
              '<button class="icon-btn" data-arch="' + r.id + '" title="' + (r.archived ? "استرجاع" : "أرشفة") + '">' + (r.archived ? "♻️" : "📥") + "</button>" +
              '<button class="icon-btn danger" data-del="' + r.id + '" title="حذف">🗑️</button>' +
            "</div></td></tr>";
        }).join("");
        body = '<div class="table-wrap"><table><thead><tr>' +
          "<th>العائلة المنتفعة</th><th>التاريخ</th><th>المقدار</th><th>نوعية الإعانة</th>" +
          "<th>المتبرّع</th><th>مقدار التبرّع</th><th>إجراءات</th>" +
          "</tr></thead><tbody>" + tr + "</tbody></table></div>";
      }

      container.innerHTML =
        '<div class="toolbar no-print">' +
          '<div class="search"><span class="si">🔍</span><input id="iSearch" placeholder="بحث بالعائلة المنتفعة أو المتبرّع أو نوعية الإعانة…" value="' + U.esc(state.q) + '"></div>' +
          '<div class="filter-pills">' +
            '<button class="pill ' + (state.filter === "active" ? "active" : "") + '" data-flt="active">السجلّات النشطة</button>' +
            '<button class="pill ' + (state.filter === "archived" ? "active" : "") + '" data-flt="archived">الأرشيف</button>' +
          "</div><div class='spacer' style='flex:1'></div>" +
          '<button class="btn secondary" id="iPrintList"><span class="ico">🖨️</span> طباعة القائمة</button>' +
          '<button class="btn secondary" id="iExport"><span class="ico">⬇️</span> تصدير Excel</button>' +
          '<button class="btn" id="iAdd"><span class="ico">＋</span> إضافة استمارة</button>' +
        "</div>" + body;

      var srch = document.getElementById("iSearch");
      srch.oninput = U.debounce(function () { state.q = srch.value; paint(); var n = document.getElementById("iSearch"); if (n) { n.focus(); n.selectionStart = n.value.length; } }, 180);
      document.getElementById("iAdd").onclick = function () { openForm(null, paint); };
      document.getElementById("iExport").onclick = exportCSV;
      document.getElementById("iPrintList").onclick = function () {
        var l = rows();
        if (!l.length) return U.toast("لا توجد بيانات للطباعة", "info");
        U.printTable("استمارات جمعية الإحسان", ["العائلة المنتفعة", "التاريخ", "المقدار", "نوعية الإعانة", "المتبرّع", "مقدار التبرّع"],
          l.map(function (r) {
            return [r.benFamily || "—", r.benDate ? U.fmtDate(r.benDate) : "—", r.benAmount ? U.fmtMoney(r.benAmount) : "—",
              r.benAidType || "—", [r.donorName, r.donorLastName].filter(Boolean).join(" ") || "—", r.donorAmount ? U.fmtMoney(r.donorAmount) : "—"];
          }));
      };
      container.querySelectorAll("[data-flt]").forEach(function (el) {
        el.onclick = function () { state.filter = el.getAttribute("data-flt"); state.q = ""; paint(); };
      });
      container.querySelectorAll("[data-open]").forEach(function (el) {
        el.onclick = function (e) { e.preventDefault(); App.navigate("ihsan", { id: el.getAttribute("data-open") }); };
      });
      container.querySelectorAll("[data-edit]").forEach(function (el) {
        el.onclick = function () { openForm(el.getAttribute("data-edit"), paint); };
      });
      container.querySelectorAll("[data-print]").forEach(function (el) {
        el.onclick = function () { printRecord(el.getAttribute("data-print")); };
      });
      container.querySelectorAll("[data-arch]").forEach(function (el) {
        el.onclick = function () {
          var r = DB.get(COLL, el.getAttribute("data-arch"));
          DB.setArchived(COLL, r.id, !r.archived);
          U.toast(r.archived ? "تمت إعادة السجلّ للنشطة" : "تمت أرشفة السجلّ"); paint();
        };
      });
      container.querySelectorAll("[data-del]").forEach(function (el) {
        el.onclick = function () {
          var r = DB.get(COLL, el.getAttribute("data-del"));
          U.confirm({ title: "حذف الاستمارة", danger: true,
            message: "حذف استمارة «" + recTitle(r) + "» نهائياً؟ لا يمكن التراجع.", okText: "حذف نهائي",
            onOk: function () { DB.remove(COLL, r.id); U.toast("تم الحذف", "info"); paint(); } });
        };
      });
    }

    function exportCSV() {
      var list = rows();
      if (!list.length) return U.toast("لا توجد بيانات للتصدير", "info");
      var headers = [
        { label: "العائلة المنتفعة", key: "benFamily" },
        { label: "التاريخ", key: "benDate" },
        { label: "المقدار", key: "benAmount" },
        { label: "نوعية الإعانة", key: "benAidType" },
        { label: "المناسبة", key: "benOccasion" },
        { label: "اسم المتبرّع", key: "donorName" },
        { label: "اللقب", key: "donorLastName" },
        { label: "تاريخ التبرّع", key: "donorDate" },
        { label: "نوعية الإعانة (تبرّع)", key: "donorAidType" },
        { label: "مقدار التبرّع", key: "donorAmount" }
      ];
      U.download("استمارات-الإحسان-" + U.today() + ".csv", U.toCSV(list, headers), "text/csv");
      U.toast("تم تصدير ملف Excel (CSV)");
    }

    paint();
  };

  /* ============ التفاصيل ============ */
  function detail(container, id) {
    var r = DB.get(COLL, id);
    if (!r) { container.innerHTML = '<div class="empty"><div class="e-ico">❓</div><h4>الاستمارة غير موجودة</h4></div>'; return; }
    function info(k, v) { return '<div class="info-item"><div class="k">' + k + '</div><div class="v">' + (v || "—") + "</div></div>"; }

    container.innerHTML =
      '<div class="toolbar no-print">' +
        '<button class="btn ghost" id="iBack">→ رجوع للقائمة</button><div class="spacer" style="flex:1"></div>' +
        '<button class="btn secondary" id="iPrint"><span class="ico">🖨️</span> طباعة</button>' +
        '<button class="btn" id="iEdit"><span class="ico">✏️</span> تعديل</button>' +
      "</div>" +
      '<div class="detail-grid">' +
        '<div class="card mb-16"><div class="card-head"><h3>👨‍👩‍👧‍👦 المنتفعون</h3></div><div class="card-body">' +
          '<div class="info-list">' +
            info("العائلة المنتفعة", U.esc(r.benFamily)) +
            info("التاريخ", r.benDate ? U.fmtDate(r.benDate) : "—") +
            info("المقدار", r.benAmount ? U.fmtMoney(r.benAmount) : "—") +
            info("نوعية الإعانة", U.esc(r.benAidType)) +
            info("المناسبة", U.esc(r.benOccasion)) +
          "</div></div></div>" +
        '<div class="card mb-16"><div class="card-head"><h3>🤝 المتبرّعون</h3></div><div class="card-body">' +
          '<div class="info-list">' +
            info("الاسم", U.esc(r.donorName)) +
            info("اللقب", U.esc(r.donorLastName)) +
            info("التاريخ", r.donorDate ? U.fmtDate(r.donorDate) : "—") +
            info("نوعية الإعانة", U.esc(r.donorAidType)) +
            info("المقدار", r.donorAmount ? U.fmtMoney(r.donorAmount) : "—") +
          "</div></div></div>" +
      "</div>";

    document.getElementById("iBack").onclick = function () { App.navigate("ihsan"); };
    document.getElementById("iEdit").onclick = function () { openForm(id, function () { detail(container, id); }); };
    document.getElementById("iPrint").onclick = function () { printRecord(id); };
  }

  /* ============ النموذج ============ */
  function openForm(id, after) {
    var r = id ? DB.get(COLL, id) : {};
    var isNew = !id;

    function kindOpts(sel) {
      return '<option value="">— اختر —</option>' + AID_KINDS.map(function (k) {
        return '<option' + (sel === k ? " selected" : "") + ">" + U.esc(k) + "</option>";
      }).join("");
    }

    var body =
      '<fieldset class="fieldset"><legend>المنتفعون</legend><div class="form-grid">' +
        '<div class="field full"><label>العائلة المنتفعة</label><input data-f="benFamily" value="' + U.esc(r.benFamily || "") + '"></div>' +
        '<div class="field"><label>التاريخ</label><input type="date" data-f="benDate" value="' + U.esc(r.benDate || U.today()) + '"></div>' +
        '<div class="field"><label>المقدار</label><input type="number" step="0.001" min="0" data-f="benAmount" value="' + U.esc(r.benAmount || "") + '"></div>' +
        '<div class="field"><label>نوعية الإعانة</label><select data-f="benAidType">' + kindOpts(r.benAidType) + "</select></div>" +
        '<div class="field"><label>المناسبة</label><input data-f="benOccasion" value="' + U.esc(r.benOccasion || "") + '" placeholder="رمضان، العيد، عاشوراء…"></div>' +
      "</div></fieldset>" +

      '<fieldset class="fieldset"><legend>المتبرّعون</legend><div class="form-grid">' +
        '<div class="field"><label>الاسم</label><input data-f="donorName" value="' + U.esc(r.donorName || "") + '"></div>' +
        '<div class="field"><label>اللقب</label><input data-f="donorLastName" value="' + U.esc(r.donorLastName || "") + '"></div>' +
        '<div class="field"><label>التاريخ</label><input type="date" data-f="donorDate" value="' + U.esc(r.donorDate || U.today()) + '"></div>' +
        '<div class="field"><label>نوعية الإعانة</label><select data-f="donorAidType">' + kindOpts(r.donorAidType) + "</select></div>" +
        '<div class="field"><label>المقدار</label><input type="number" step="0.001" min="0" data-f="donorAmount" value="' + U.esc(r.donorAmount || "") + '"></div>' +
      "</div></fieldset>";

    U.openModal({
      title: isNew ? "إضافة استمارة إحسان" : "تعديل الاستمارة",
      wide: true,
      body: body,
      footer: '<button class="btn" id="iSave"><span class="ico">💾</span> حفظ</button>' +
              '<button class="btn secondary" id="iCancel">إلغاء</button>',
      onOpen: function (root) {
        root.querySelector("#iCancel").onclick = U.closeModal;
        root.querySelector("#iSave").onclick = function () {
          var data = U.formData(root);
          if (!data.benFamily && !data.donorName) { U.toast("أدخل العائلة المنتفعة أو اسم المتبرّع", "error"); return; }
          if (isNew) { DB.insert(COLL, data); U.toast("تمت إضافة الاستمارة"); }
          else { DB.update(COLL, id, data); U.toast("تم تحديث الاستمارة"); }
          U.closeModal();
          after && after();
        };
      }
    });
  }

  /* ============ الطباعة ============ */
  function printRecord(id) {
    var r = DB.get(COLL, id);
    if (!r) return;
    function row(k, v) { return "<div><b>" + k + ":</b> " + U.esc(v || "—") + "</div>"; }
    var html =
      "<h2>المنتفعون</h2><div class='kv'>" +
        row("العائلة المنتفعة", r.benFamily) +
        row("التاريخ", r.benDate ? U.fmtDate(r.benDate) : "—") +
        row("المقدار", r.benAmount ? U.fmtMoney(r.benAmount) : "—") +
        row("نوعية الإعانة", r.benAidType) +
        row("المناسبة", r.benOccasion) +
      "</div>" +
      "<h2>المتبرّعون</h2><div class='kv'>" +
        row("الاسم", r.donorName) +
        row("اللقب", r.donorLastName) +
        row("التاريخ", r.donorDate ? U.fmtDate(r.donorDate) : "—") +
        row("نوعية الإعانة", r.donorAidType) +
        row("المقدار", r.donorAmount ? U.fmtMoney(r.donorAmount) : "—") +
      "</div>" +
      '<div class="sign"><div><div class="line">إمضاء العون المكلّف</div></div><div><div class="line">إمضاء رئيس اللجنة</div></div></div>';
    U.printHTML("استمارة جمعية الإحسان", html);
  }
})(window);

</script>
  <script>
/* =================================================================
   finance.js — المساعدات، التبرعات، المصاريف، المداخيل (الشأن المالي)
   ================================================================= */
(function (global) {
  "use strict";
  var App = global.App || (global.App = { views: {} });
  App.views = App.views || {};

  var AID_KINDS = ["مالي", "عيني (مواد غذائية)", "ملابس", "أدوية", "أضحية", "كسوة العيد", "قفّة رمضان", "كراس ومستلزمات مدرسية", "أخرى"];
  var EXP_CAT = ["مساعدات مباشرة", "كراء", "فواتير (ماء/كهرباء)", "نقل", "مصاريف إدارية", "صيانة", "أخرى"];
  var INC_SRC = ["تبرعات نقدية", "اشتراكات الأعضاء", "هبات", "دعم رسمي", "أنشطة وحملات", "أخرى"];

  function bName(id) { var b = DB.get("beneficiaries", id); return b ? App.beneficiaryFullName(b) : "—"; }
  function dName(id) { var d = DB.get("donors", id); return d ? App.donorFullName(d) : "—"; }

  /* ============ نموذج المساعدة (مشترك مع ملف المنتفع) ============ */
  App.aidForm = function (beneficiaryId, after, aidId) {
    var a = aidId ? DB.get("aid", aidId) : {};
    var isNew = !aidId;
    var needPick = !beneficiaryId;
    var benList = DB.all("beneficiaries").filter(function (b) { return !b.archived; });
    var pick = needPick ? '<div class="field full"><label>المنتفع <span class="req">*</span></label><select data-f="beneficiaryId"><option value="">— اختر العائلة —</option>' +
      benList.map(function (b) { return '<option value="' + b.id + '">' + U.esc(App.beneficiaryFullName(b)) + " — " + U.esc(b.fileNo || "") + "</option>"; }).join("") + "</select></div>" : "";
    var kinds = AID_KINDS.map(function (k) { return '<option' + (a.type === k ? " selected" : "") + ">" + U.esc(k) + "</option>"; }).join("");

    U.openModal({
      title: isNew ? "إضافة مساعدة" : "تعديل المساعدة",
      body: '<div class="form-grid">' + pick +
        '<div class="field"><label>التاريخ</label><input type="date" data-f="date" value="' + U.esc(a.date || U.today()) + '"></div>' +
        '<div class="field"><label>المقدار</label><input type="number" step="0.001" min="0" data-f="amount" value="' + U.esc(a.amount || "") + '"></div>' +
        '<div class="field"><label>نوعية الإعانة</label><select data-f="type"><option value="">— اختر —</option>' + kinds + "</select></div>" +
        '<div class="field"><label>المناسبة</label><input data-f="occasion" value="' + U.esc(a.occasion || "") + '" placeholder="رمضان، العيد، الدخول المدرسي…"></div>' +
        '<div class="field full"><label>ملاحظة</label><input data-f="note" value="' + U.esc(a.note || "") + '"></div>' +
      "</div>",
      footer: '<button class="btn" id="aSave"><span class="ico">💾</span> حفظ</button><button class="btn secondary" id="aCancel">إلغاء</button>',
      onOpen: function (root) {
        root.querySelector("#aCancel").onclick = U.closeModal;
        root.querySelector("#aSave").onclick = function () {
          var data = U.formData(root);
          var bid = beneficiaryId || data.beneficiaryId;
          if (!bid) { U.toast("يُرجى اختيار المنتفع", "error"); return; }
          if (!data.amount && !data.type) { U.toast("أدخل المقدار أو نوعية الإعانة", "error"); return; }
          data.beneficiaryId = bid;
          if (isNew) { DB.insert("aid", data); U.toast("تمت إضافة المساعدة"); }
          else { DB.update("aid", aidId, data); U.toast("تم التحديث"); }
          U.closeModal(); after && after();
        };
      }
    });
  };

  /* ============ نموذج عام (مصروف / مدخول) ============ */
  function txForm(coll, opts, after, txId) {
    var x = txId ? DB.get(coll, txId) : {};
    var isNew = !txId;
    var catOpts = opts.cats.map(function (c) { return '<option' + (x[opts.catKey] === c ? " selected" : "") + ">" + U.esc(c) + "</option>"; }).join("");
    U.openModal({
      title: (isNew ? "إضافة " : "تعديل ") + opts.title,
      body: '<div class="form-grid">' +
        '<div class="field"><label>التاريخ</label><input type="date" data-f="date" value="' + U.esc(x.date || U.today()) + '"></div>' +
        '<div class="field"><label>المقدار <span class="req">*</span></label><input type="number" step="0.001" min="0" data-f="amount" value="' + U.esc(x.amount || "") + '"></div>' +
        '<div class="field full"><label>' + opts.labelText + '</label><input data-f="label" value="' + U.esc(x.label || "") + '"></div>' +
        '<div class="field full"><label>' + opts.catLabel + '</label><select data-f="' + opts.catKey + '"><option value="">— اختر —</option>' + catOpts + "</select></div>" +
      "</div>",
      footer: '<button class="btn" id="txSave"><span class="ico">💾</span> حفظ</button><button class="btn secondary" id="txCancel">إلغاء</button>',
      onOpen: function (root) {
        root.querySelector("#txCancel").onclick = U.closeModal;
        root.querySelector("#txSave").onclick = function () {
          var data = U.formData(root);
          if (!data.amount) { U.toast("المقدار إجباري", "error"); return; }
          if (isNew) { DB.insert(coll, data); U.toast("تمت الإضافة"); }
          else { DB.update(coll, txId, data); U.toast("تم التحديث"); }
          U.closeModal(); after && after();
        };
      }
    });
  }
  App.expenseForm = function (after, id) {
    txForm("expenses", { title: "مصروف", labelText: "البيان / الوصف", catLabel: "الفئة", catKey: "category", cats: EXP_CAT }, after, id);
  };
  App.incomeForm = function (after, id) {
    txForm("incomes", { title: "مدخول", labelText: "البيان / الوصف", catLabel: "المصدر", catKey: "source", cats: INC_SRC }, after, id);
  };

  /* ============ العرض المالي (تبويبات) ============ */
  App.views.finance = function (container, params) {
    var tab = (params && params.tab) || "aid";

    function totalsBar() {
      var inflow = DB.sum("donations", "amount") + DB.sum("incomes", "amount");
      var outflow = DB.sum("aid", "amount") + DB.sum("expenses", "amount");
      var bal = inflow - outflow;
      return '<div class="cards grid-3 mb-16">' +
        stat("green", "📈", "إجمالي المداخيل (تبرعات + مداخيل)", U.fmtMoney(inflow)) +
        stat("red", "📉", "إجمالي المصاريف (مساعدات + مصاريف)", U.fmtMoney(outflow)) +
        stat(bal >= 0 ? "gold" : "red", "⚖️", "الرصيد الصافي", U.fmtMoney(bal)) +
        "</div>";
    }
    function stat(cls, ico, label, val) {
      return '<div class="stat ' + cls + '"><div class="ico-bg">' + ico + '</div><div class="meta"><div class="label">' + label + '</div><div class="value" style="font-size:22px">' + val + "</div></div></div>";
    }

    function paint() {
      var tabs = [
        { k: "aid", t: "🎁 المساعدات الممنوحة" },
        { k: "donations", t: "🤝 التبرعات الواردة" },
        { k: "expenses", t: "📉 المصاريف" },
        { k: "incomes", t: "📈 المداخيل" }
      ];
      container.innerHTML = totalsBar() +
        '<div class="sub-tabs no-print">' + tabs.map(function (x) {
          return '<button class="' + (tab === x.k ? "active" : "") + '" data-tab="' + x.k + '">' + x.t + "</button>";
        }).join("") + "</div><div id='finBody'></div>";

      container.querySelectorAll("[data-tab]").forEach(function (el) {
        el.onclick = function () { tab = el.getAttribute("data-tab"); paint(); };
      });

      var body = container.querySelector("#finBody");
      if (tab === "aid") renderAid(body);
      else if (tab === "donations") renderDonations(body);
      else if (tab === "expenses") renderTx(body, "expenses", "مصروف", "category", "الفئة", "out", App.expenseForm);
      else renderTx(body, "incomes", "مدخول", "source", "المصدر", "in", App.incomeForm);
    }

    function renderAid(body) {
      var list = DB.all("aid").sort(function (a, b) { return (b.date || "").localeCompare(a.date || ""); });
      var total = list.reduce(function (s, a) { return s + (parseFloat(a.amount) || 0); }, 0);
      var rows = list.length ? list.map(function (a) {
        return "<tr><td>" + U.fmtDate(a.date) + '</td><td><a href="#" data-b="' + a.beneficiaryId + '" style="font-weight:700">' + U.esc(bName(a.beneficiaryId)) + "</a></td>" +
          "<td>" + U.esc(a.type || "—") + "</td><td>" + U.esc(a.occasion || "—") + '</td><td class="money out">' + U.fmtMoney(a.amount) + "</td>" +
          '<td><div class="t-actions"><button class="icon-btn" data-e="' + a.id + '">✏️</button><button class="icon-btn danger" data-x="' + a.id + '">🗑️</button></div></td></tr>';
      }).join("") : empty("🎁", "لا توجد مساعدات مسجّلة");
      body.innerHTML = bar("إضافة مساعدة", "addBtn", "gold") +
        wrapTable(["التاريخ", "المنتفع", "نوعية الإعانة", "المناسبة", "المقدار", "إجراءات"], rows, "المجموع", U.fmtMoney(total), "out", list.length);
      body.querySelector("#addBtn").onclick = function () { App.aidForm(null, paint); };
      body.querySelector("#printBtn").onclick = function () {
        if (!list.length) return U.toast("لا توجد بيانات للطباعة", "info");
        U.printTable("المساعدات الممنوحة", ["التاريخ", "المنتفع", "نوعية الإعانة", "المناسبة", "المقدار"],
          list.map(function (a) { return [U.fmtDate(a.date), bName(a.beneficiaryId), a.type || "—", a.occasion || "—", U.fmtMoney(a.amount)]; }),
          { footer: "المجموع: " + U.fmtMoney(total) });
      };
      body.querySelectorAll("[data-b]").forEach(function (el) { el.onclick = function (e) { e.preventDefault(); App.navigate("beneficiaries", { id: el.getAttribute("data-b") }); }; });
      body.querySelectorAll("[data-e]").forEach(function (el) { el.onclick = function () { App.aidForm(null, paint, el.getAttribute("data-e")); }; });
      body.querySelectorAll("[data-x]").forEach(function (el) { el.onclick = function () { delConfirm("aid", el.getAttribute("data-x"), paint); }; });
    }

    function renderDonations(body) {
      var list = DB.all("donations").sort(function (a, b) { return (b.date || "").localeCompare(a.date || ""); });
      var total = list.reduce(function (s, a) { return s + (parseFloat(a.amount) || 0); }, 0);
      var rows = list.length ? list.map(function (a) {
        return "<tr><td>" + U.fmtDate(a.date) + '</td><td><a href="#" data-d="' + a.donorId + '" style="font-weight:700">' + U.esc(dName(a.donorId)) + "</a></td>" +
          "<td>" + U.esc(a.type || "—") + "</td><td>" + U.esc(a.occasion || "—") + '</td><td class="money in">' + U.fmtMoney(a.amount) + "</td>" +
          '<td><div class="t-actions"><button class="icon-btn" data-e="' + a.id + '">✏️</button><button class="icon-btn danger" data-x="' + a.id + '">🗑️</button></div></td></tr>';
      }).join("") : empty("🤝", "لا توجد تبرّعات مسجّلة");
      body.innerHTML = bar("تسجيل تبرّع", "addBtn", "gold") +
        wrapTable(["التاريخ", "المتبرّع", "نوعية الإعانة", "المناسبة", "المقدار", "إجراءات"], rows, "المجموع", U.fmtMoney(total), "in", list.length);
      body.querySelector("#addBtn").onclick = function () { App.donationForm(null, paint); };
      body.querySelector("#printBtn").onclick = function () {
        if (!list.length) return U.toast("لا توجد بيانات للطباعة", "info");
        U.printTable("التبرعات الواردة", ["التاريخ", "المتبرّع", "نوعية الإعانة", "المناسبة", "المقدار"],
          list.map(function (a) { return [U.fmtDate(a.date), dName(a.donorId), a.type || "—", a.occasion || "—", U.fmtMoney(a.amount)]; }),
          { footer: "المجموع: " + U.fmtMoney(total) });
      };
      body.querySelectorAll("[data-d]").forEach(function (el) { el.onclick = function (e) { e.preventDefault(); App.navigate("donors", { id: el.getAttribute("data-d") }); }; });
      body.querySelectorAll("[data-e]").forEach(function (el) { el.onclick = function () { App.donationForm(null, paint, el.getAttribute("data-e")); }; });
      body.querySelectorAll("[data-x]").forEach(function (el) { el.onclick = function () { delConfirm("donations", el.getAttribute("data-x"), paint); }; });
    }

    function renderTx(body, coll, title, catKey, catLabel, dir, formFn) {
      var list = DB.all(coll).sort(function (a, b) { return (b.date || "").localeCompare(a.date || ""); });
      var total = list.reduce(function (s, a) { return s + (parseFloat(a.amount) || 0); }, 0);
      var rows = list.length ? list.map(function (a) {
        return "<tr><td>" + U.fmtDate(a.date) + "</td><td>" + U.esc(a.label || "—") + "</td><td>" + U.esc(a[catKey] || "—") +
          '</td><td class="money ' + dir + '">' + U.fmtMoney(a.amount) + '</td><td><div class="t-actions">' +
          '<button class="icon-btn" data-e="' + a.id + '">✏️</button><button class="icon-btn danger" data-x="' + a.id + '">🗑️</button></div></td></tr>';
      }).join("") : empty(dir === "in" ? "📈" : "📉", "لا توجد سجلّات");
      body.innerHTML = bar("إضافة " + title, "addBtn", dir === "in" ? "" : "danger") +
        wrapTable(["التاريخ", "البيان", catLabel, "المقدار", "إجراءات"], rows, "المجموع", U.fmtMoney(total), dir, list.length);
      body.querySelector("#addBtn").onclick = function () { formFn(paint); };
      body.querySelector("#printBtn").onclick = function () {
        if (!list.length) return U.toast("لا توجد بيانات للطباعة", "info");
        U.printTable(dir === "in" ? "المداخيل" : "المصاريف", ["التاريخ", "البيان", catLabel, "المقدار"],
          list.map(function (a) { return [U.fmtDate(a.date), a.label || "—", a[catKey] || "—", U.fmtMoney(a.amount)]; }),
          { footer: "المجموع: " + U.fmtMoney(total) });
      };
      body.querySelectorAll("[data-e]").forEach(function (el) { el.onclick = function () { formFn(paint, el.getAttribute("data-e")); }; });
      body.querySelectorAll("[data-x]").forEach(function (el) { el.onclick = function () { delConfirm(coll, el.getAttribute("data-x"), paint); }; });
    }

    function bar(label, id, cls) {
      return '<div class="toolbar no-print"><div class="spacer" style="flex:1"></div>' +
        '<button class="btn secondary" id="printBtn"><span class="ico">🖨️</span> طباعة</button>' +
        '<button class="btn ' + (cls || "") + '" id="' + id + '"><span class="ico">＋</span> ' + label + "</button></div>";
    }
    function wrapTable(headers, rows, totalLabel, totalVal, dir, count) {
      var foot = count ? '<tfoot><tr><th colspan="' + (headers.length - 2) + '" style="text-align:left;background:var(--green-50)">' + totalLabel +
        '</th><th class="money ' + dir + '" style="background:var(--green-50)">' + totalVal + '</th><th style="background:var(--green-50)"></th></tr></tfoot>' : "";
      return '<div class="table-wrap"><table><thead><tr>' + headers.map(function (h) { return "<th>" + h + "</th>"; }).join("") + "</tr></thead><tbody>" + rows + "</tbody>" + foot + "</table></div>";
    }
    function empty(ico, txt) { return '<tr><td colspan="9"><div class="empty"><div class="e-ico">' + ico + "</div><h4>" + txt + "</h4></div></td></tr>"; }
    function delConfirm(coll, id, cb) {
      U.confirm({ title: "حذف السجلّ", danger: true, message: "حذف هذا السجلّ نهائياً؟", okText: "حذف", onOk: function () { DB.remove(coll, id); U.toast("تم الحذف", "info"); cb(); } });
    }

    paint();
  };
})(window);

</script>
  <script>
/* =================================================================
   dashboard.js — الرئيسية والإحصائيات
   ================================================================= */
(function (global) {
  "use strict";
  var App = global.App || (global.App = { views: {} });
  App.views = App.views || {};

  App.views.dashboard = function (container) {
    var s = DB.settings();
    var benAll = DB.all("beneficiaries"), ben = benAll.filter(function (b) { return !b.archived; });
    var memAll = DB.all("members"), mem = memAll.filter(function (m) { return !m.archived; });
    var donAll = DB.all("donors"), don = donAll.filter(function (d) { return !d.archived; });

    var totalDonations = DB.sum("donations", "amount");
    var totalIncome = DB.sum("incomes", "amount");
    var totalAid = DB.sum("aid", "amount");
    var totalExpense = DB.sum("expenses", "amount");
    var inflow = totalDonations + totalIncome;
    var outflow = totalAid + totalExpense;
    var balance = inflow - outflow;
    var familiesServed = (function () { var ids = {}; DB.all("aid").forEach(function (a) { ids[a.beneficiaryId] = 1; }); return Object.keys(ids).length; })();

    function stat(cls, ico, label, value, unit) {
      return '<div class="stat ' + cls + '"><div class="ico-bg">' + ico + '</div>' +
        '<div class="meta"><div class="label">' + label + '</div>' +
        '<div class="value">' + value + (unit ? ' <span class="unit">' + unit + "</span>" : "") + "</div></div></div>";
    }

    /* تصنيف حسب نوع العائلة */
    function breakdown(list, field, fallback) {
      var map = {};
      list.forEach(function (x) { var k = x[field] || fallback; map[k] = (map[k] || 0) + 1; });
      var arr = Object.keys(map).map(function (k) { return { k: k, v: map[k] }; }).sort(function (a, b) { return b.v - a.v; });
      var max = arr.reduce(function (m, x) { return Math.max(m, x.v); }, 0) || 1;
      if (!arr.length) return '<div class="muted" style="padding:10px">لا توجد بيانات بعد</div>';
      return '<div class="bars">' + arr.map(function (x) {
        return '<div class="bar-row"><div>' + U.esc(x.k) + '</div><div class="bar-track"><div class="bar-fill" style="width:' + Math.round(x.v / max * 100) + '%"></div></div><div class="bv">' + U.fmtNum(x.v) + "</div></div>";
      }).join("") + "</div>";
    }

    /* آخر النشاطات */
    var recentAid = DB.all("aid").sort(function (a, b) { return (b.date || "").localeCompare(a.date || ""); }).slice(0, 6);
    var recentDon = DB.all("donations").sort(function (a, b) { return (b.date || "").localeCompare(a.date || ""); }).slice(0, 6);
    function bName(id) { var b = DB.get("beneficiaries", id); return b ? App.beneficiaryFullName(b) : "—"; }
    function dName(id) { var d = DB.get("donors", id); return d ? App.donorFullName(d) : "—"; }

    function activityRows(list, nameFn, dir) {
      if (!list.length) return '<tr><td colspan="3" class="muted" style="text-align:center;padding:18px">لا يوجد نشاط بعد</td></tr>';
      return list.map(function (x) {
        return "<tr><td>" + U.fmtDate(x.date) + "</td><td>" + U.esc(nameFn(x[dir === "in" ? "donorId" : "beneficiaryId"])) +
          (x.type ? ' <span class="tag gray">' + U.esc(x.type) + "</span>" : "") + '</td><td class="money ' + dir + '">' + U.fmtMoney(x.amount) + "</td></tr>";
      }).join("");
    }

    container.innerHTML =
      '<div class="toolbar no-print"><div class="spacer" style="flex:1"></div>' +
        '<button class="btn secondary" id="dashPrint"><span class="ico">🖨️</span> طباعة لوحة الإحصائيات</button></div>' +
      '<div class="cards grid-4 mb-16">' +
        stat("green", "👨‍👩‍👧‍👦", "العائلات", U.fmtNum(ben.length), "عائلة") +
        stat("gold", "👤", "المنتفعون (الأفراد)", U.fmtNum(mem.length), "فرد") +
        stat("blue", "🤝", "المتبرّعون", U.fmtNum(don.length), "متبرّع") +
        stat(balance >= 0 ? "green" : "red", "⚖️", "الرصيد الصافي", U.fmtMoney(balance)) +
      "</div>" +

      '<div class="cards grid-4 mb-16">' +
        stat("blue", "📈", "إجمالي التبرعات والمداخيل", U.fmtMoney(inflow)) +
        stat("red", "🎁", "إجمالي المساعدات الممنوحة", U.fmtMoney(totalAid)) +
        stat("blue", "🧾", "عدد عمليات المساعدة", U.fmtNum(DB.count("aid", true)), "عملية") +
        stat("gold", "❤️", "عائلات استفادت فعلياً", U.fmtNum(familiesServed), "عائلة") +
      "</div>" +

      '<div class="cards grid-2 mb-16">' +
        '<div class="card"><div class="card-head"><h3>🏷️ توزيع العائلات حسب النوع</h3></div><div class="card-body">' + breakdown(ben, "familyType", "غير محدّد") + "</div></div>" +
        '<div class="card"><div class="card-head"><h3>🩺 التغطية الاجتماعية</h3></div><div class="card-body">' + breakdown(ben, "coverage", "غير محدّدة") + "</div></div>" +
      "</div>" +

      '<div class="cards grid-2">' +
        '<div class="card"><div class="card-head"><h3>🎁 آخر المساعدات</h3><div class="spacer"></div><button class="btn sm secondary" data-go="finance">عرض الكل</button></div>' +
          '<div class="table-wrap" style="border:none;box-shadow:none;border-radius:0"><table><thead><tr><th>التاريخ</th><th>المنتفع</th><th>المقدار</th></tr></thead><tbody>' + activityRows(recentAid, bName, "out") + "</tbody></table></div></div>" +
        '<div class="card"><div class="card-head"><h3>🤝 آخر التبرعات</h3><div class="spacer"></div><button class="btn sm secondary" data-go="donors">عرض الكل</button></div>' +
          '<div class="table-wrap" style="border:none;box-shadow:none;border-radius:0"><table><thead><tr><th>التاريخ</th><th>المتبرّع</th><th>المقدار</th></tr></thead><tbody>' + activityRows(recentDon, dName, "in") + "</tbody></table></div></div>" +
      "</div>";

    container.querySelectorAll("[data-go]").forEach(function (el) {
      el.onclick = function () { App.navigate(el.getAttribute("data-go")); };
    });

    document.getElementById("dashPrint").onclick = function () {
      var rows = [
        ["العائلات", U.fmtNum(ben.length) + " عائلة"],
        ["المنتفعون (الأفراد)", U.fmtNum(mem.length) + " فرد"],
        ["المتبرّعون", U.fmtNum(don.length) + " متبرّع"],
        ["إجمالي التبرعات والمداخيل", U.fmtMoney(inflow)],
        ["إجمالي المساعدات الممنوحة", U.fmtMoney(totalAid)],
        ["إجمالي المصاريف", U.fmtMoney(totalExpense)],
        ["الرصيد الصافي", U.fmtMoney(balance)],
        ["عدد عمليات المساعدة", U.fmtNum(DB.count("aid", true)) + " عملية"],
        ["عائلات استفادت فعلياً", U.fmtNum(familiesServed) + " عائلة"]
      ];
      var kv = '<div class="kv">' + rows.map(function (r) { return "<div><b>" + r[0] + ":</b> " + U.esc(r[1]) + "</div>"; }).join("") + "</div>";
      U.printHTML("لوحة الإحصائيات — " + s.orgName, "<h2>ملخّص عام</h2>" + kv);
    };

    // ترحيب عند فراغ البيانات
    if (DB.isEmpty()) {
      var hint = document.createElement("div");
      hint.className = "card mt-20";
      hint.innerHTML = '<div class="card-body" style="text-align:center;padding:30px">' +
        '<div style="font-size:42px">🌱</div><h3 style="margin:8px 0;color:var(--green-900)">مرحباً بكم في نظام إدارة ' + U.esc(s.orgName) + "</h3>" +
        '<p class="muted" style="max-width:520px;margin:0 auto 16px">ابدأ بإضافة العائلات المنتفعة والمتبرعين. كل البيانات تُحفظ على هذا الجهاز، وننصح بأخذ نسخة احتياطية دورية من قسم «الإعدادات».</p>' +
        '<button class="btn" id="seedBtn"><span class="ico">＋</span> إضافة أوّل عائلة</button></div>';
      container.appendChild(hint);
      document.getElementById("seedBtn").onclick = function () { App.navigate("beneficiaries"); setTimeout(function () { var a = document.getElementById("bAdd"); a && a.click(); }, 60); };
    }
  };
})(window);

</script>

(function (global) {

    function counts() {
      return {
        beneficiaries: DB.count("beneficiaries", true),
        donors: DB.count("donors", true),
        aid: DB.count("aid", true),
        donations: DB.count("donations", true),
        expenses: DB.count("expenses", true),
        incomes: DB.count("incomes", true)
      };
    }
    var c = counts();

    container.innerHTML =
      '<div class="cards grid-2">' +

        // معلومات الجمعية
        '<div class="card"><div class="card-head"><h3>🏛️ معلومات الجمعية</h3></div><div class="card-body">' +

        "</div></div>" +

        // النسخ الاحتياطي
        '<div class="card"><div class="card-head"><h3>💾 النسخ الاحتياطي والاسترجاع</h3></div><div class="card-body">' +
          '<p class="muted" style="margin-top:0">البيانات محفوظة على هذا الجهاز فقط. خُذ نسخة احتياطية بانتظام واحفظها في مكان آمن (USB، بريد إلكتروني…).</p>' +
          '<div class="info-list" style="margin-bottom:16px">' +
            kv("العائلات المنتفعة", c.beneficiaries) + kv("المتبرّعون", c.donors) +
            kv("سجلّات المساعدات", c.aid) + kv("سجلّات التبرعات", c.donations) +
            kv("المصاريف", c.expenses) + kv("المداخيل", c.incomes) +
          "</div>" +
          '<button class="btn block" id="backupBtn"><span class="ico">⬇️</span> تنزيل نسخة احتياطية (JSON)</button>' +
          '<div style="height:10px"></div>' +
          '<label class="btn secondary block" style="cursor:pointer"><span class="ico">⬆️</span> استرجاع من ملف نسخة احتياطية' +
            '<input type="file" id="restoreInput" accept="application/json,.json" style="display:none"></label>' +
        "</div></div>" +

      "</div>" +

      // منطقة الخطر
      '<div class="card mt-20" style="border-color:#f3c9c4">' +
        '<div class="card-head" style="border-color:#f3c9c4"><h3 style="color:var(--danger)">⚠️ منطقة الخطر</h3></div>' +
        '<div class="card-body"><div class="row-between" style="flex-wrap:wrap;gap:12px">' +
          '<div><strong>حذف كل البيانات</strong><div class="muted" style="font-size:13px">يمسح جميع السجلّات نهائياً من هذا الجهاز. خُذ نسخة احتياطية أولاً.</div></div>' +
          '<button class="btn danger" id="wipeBtn"><span class="ico">🗑️</span> حذف كل البيانات</button>' +
        "</div></div></div>" +

      '<p class="muted" style="text-align:center;margin-top:26px;font-size:12.5px">نظام إدارة العائلات والمتبرعين — نسخة 1.0 · يعمل دون اتصال بالإنترنت</p>';

    function kv(k, v) { return '<div class="info-item"><div class="k">' + k + '</div><div class="v">' + U.fmtNum(v) + "</div></div>"; }

    document.getElementById("saveSettings").onclick = function () {
      var data = U.formData(container);
      DB.saveSettings({ orgName: data.orgName || s.orgName, orgBranch: data.orgBranch, currency: data.currency || "د.ت", year: data.year });
      U.toast("تم حفظ المعلومات");
      App.refreshChrome && App.refreshChrome();
    };

    document.getElementById("backupBtn").onclick = function () {
      var payload = DB.exportAll();
      U.download("نسخة-احتياطية-" + U.today() + ".json", JSON.stringify(payload, null, 2), "application/json");
      U.toast("تم تنزيل النسخة الاحتياطية");
    };

    document.getElementById("restoreInput").onchange = function (e) {
      var file = e.target.files[0]; if (!file) return;
      var reader = new FileReader();
      reader.onload = function () {
        var payload;
        try { payload = JSON.parse(reader.result); } catch (err) { U.toast("ملف غير صالح", "error"); return; }
        if (!payload.data) { U.toast("الملف لا يحتوي على بيانات صالحة", "error"); return; }
        U.openModal({
          title: "استرجاع البيانات",
          body: '<p>اختر طريقة الاسترجاع:</p>' +
            '<div style="display:flex;flex-direction:column;gap:10px">' +
              '<label class="radio-chip" style="display:block"><input type="radio" name="mode" value="replace" checked><span style="display:block;text-align:right">استبدال كامل — يحذف البيانات الحالية ويضع بيانات الملف</span></label>' +
              '<label class="radio-chip" style="display:block"><input type="radio" name="mode" value="merge"><span style="display:block;text-align:right">دمج — يضيف سجلّات الملف الجديدة دون حذف الحالية</span></label>' +
            "</div>",
          footer: '<button class="btn" id="doRestore"><span class="ico">⬆️</span> استرجاع</button><button class="btn secondary" id="cancelRestore">إلغاء</button>',
          onOpen: function (root) {
            root.querySelector("#cancelRestore").onclick = U.closeModal;
            root.querySelector("#doRestore").onclick = function () {
              var mode = root.querySelector('input[name="mode"]:checked').value;
              try {
                DB.importAll(payload, mode);
                U.closeModal(); U.toast("تم استرجاع البيانات بنجاح");
                App.refreshChrome && App.refreshChrome();
                App.navigate("settings");
              } catch (err) { U.toast("تعذّر الاسترجاع: " + err.message, "error"); }
            };
          }
        });
        e.target.value = "";
      };
      reader.readAsText(file);
    };

    document.getElementById("wipeBtn").onclick = function () {
      U.confirm({
        title: "حذف كل البيانات", danger: true,
        message: "سيتم حذف جميع العائلات والمتبرعين والسجلّات المالية نهائياً من هذا الجهاز. لا يمكن التراجع. هل أنت متأكّد؟",
        okText: "نعم، احذف كل شيء",
        onOk: function () {
          U.confirm({
            title: "تأكيد أخير", danger: true,
            message: "هل أخذت نسخة احتياطية؟ سيتم الآن مسح كل البيانات.",
            okText: "متابعة الحذف",
            onOk: function () { DB.clearAll(); U.toast("تم حذف جميع البيانات", "info"); App.refreshChrome && App.refreshChrome(); App.navigate("dashboard"); }
          });
        }
      });
    };
  };
})(window);

</script>
  <script>
/* =================================================================
   search.js — البحث الشامل (عائلات + أفراد + متبرّعون)
   شريط بحث في الأعلى يجد أيّ عائلة أو فرد (ابن/مكفول) أو متبرّع
   من أيّ قسم، مع لوحة نتائج قابلة للتنقّل بالفأرة أو لوحة المفاتيح.
   ================================================================= */
(function (global) {
  "use strict";
  var App = global.App || (global.App = { views: {} });
  var MAX = 6;

  function fam(b) { return App.beneficiaryFullName ? App.beneficiaryFullName(b) : [b.firstName, b.lastName].filter(Boolean).join(" "); }
  function don(d) { return App.donorFullName ? App.donorFullName(d) : [d.firstName, d.lastName].filter(Boolean).join(" "); }

  /* محرّك البحث — متاح أيضاً للاستعمال البرمجي/الاختبار */
  function searchAll(q) {
    var res = { families: [], members: [], donors: [] };
    q = (q || "").trim().toLowerCase();
    if (!q) return res;
    DB.all("beneficiaries").forEach(function (b) {
      if (U.match(b, q, ["firstName", "lastName", "nickname", "fileNo", "cin", "phone", "address"])) res.families.push(b);
    });
    DB.all("members").forEach(function (m) {
      if (U.match(m, q, ["firstName", "lastName", "nickname", "fileNo", "cin", "phone", "grade", "work"])) {
        res.members.push({ m: m });
      }
    });
    DB.all("donors").forEach(function (d) {
      if (U.match(d, q, ["firstName", "lastName", "phone", "type"])) res.donors.push(d);
    });
    return res;
  }
  App.searchAll = searchAll;

  App.initGlobalSearch = function () {
    var wrap = document.getElementById("globalSearch");
    var input = document.getElementById("gsInput");
    var panel = document.getElementById("gsResults");
    if (!wrap || !input || !panel) return;

    var items = [];   // قائمة مسطّحة لكل نتيجة قابلة للفتح
    var active = -1;

    function close() { panel.classList.remove("open"); panel.innerHTML = ""; items = []; active = -1; }
    function go(it) { close(); input.value = ""; input.blur(); it.fn(); if (it.toast) U.toast(it.toast, "info"); }

    function more(n) { return '<div class="gs-more">+ ' + U.fmtNum(n) + " نتيجة أخرى… واصل الكتابة لتضييق البحث</div>"; }
    function item(icoCls, ico, title, sub, tag) {
      var idx = items.length;
      return '<div class="gs-item" data-i="' + idx + '"><div class="gi ' + icoCls + '">' + ico + "</div>" +
        '<div class="gtxt"><div class="gt">' + U.esc(title) + (tag ? ' <span class="tag gray gs-tag">' + tag + "</span>" : "") + "</div>" +
        (sub ? '<div class="gsub">' + sub + "</div>" : "") + "</div></div>";
    }

    function render() {
      var q = input.value.trim();
      items = []; active = -1;
      if (!q) { close(); return; }
      var r = searchAll(q);
      var total = r.families.length + r.members.length + r.donors.length;
      if (!total) {
        panel.innerHTML = '<div class="gs-empty">لا توجد نتائج لـ «' + U.esc(q) + "»</div>";
        panel.classList.add("open"); return;
      }
      var html = "";

      if (r.families.length) {
        html += '<div class="gs-group">👨‍👩‍👧‍👦 العائلات (' + U.fmtNum(r.families.length) + ")</div>";
        r.families.slice(0, MAX).forEach(function (b) {
          var sub = "رقم الملف: " + U.esc(b.fileNo || "—") + (b.phone ? " · ☎ " + U.esc(b.phone) : "");
          html += item("ic-green", "👨‍👩‍👧‍👦", fam(b), sub, b.archived ? "مؤرشف" : "");
          items.push({ fn: function () { App.navigate("beneficiaries", { id: b.id }); } });
        });
        if (r.families.length > MAX) html += more(r.families.length - MAX);
      }

      if (r.members.length) {
        html += '<div class="gs-group">👤 المنتفعون — الأفراد (' + U.fmtNum(r.members.length) + ")</div>";
        r.members.slice(0, MAX).forEach(function (row) {
          var m = row.m;
          var name = App.memberFullName ? App.memberFullName(m) : [m.firstName, m.lastName].filter(Boolean).join(" ");
          var age = m.dob && U.age(m.dob) !== "" ? " · " + U.age(m.dob) + " سنة" : "";
          var sub = "رقم الملف: " + U.esc(m.fileNo || "—") + (m.phone ? " · ☎ " + U.esc(m.phone) : "") + age;
          html += item("ic-gold", "👤", name, sub, m.archived ? "مؤرشف" : "");
          items.push({ fn: function () { App.navigate("members", { id: m.id }); } });
        });
        if (r.members.length > MAX) html += more(r.members.length - MAX);
      }

      if (r.donors.length) {
        html += '<div class="gs-group">🤝 المتبرّعون (' + U.fmtNum(r.donors.length) + ")</div>";
        r.donors.slice(0, MAX).forEach(function (d) {
          var sub = d.phone ? "☎ " + U.esc(d.phone) : U.esc(d.type || "متبرّع");
          html += item("ic-blue", "🤝", don(d), sub, d.archived ? "مؤرشف" : "");
          items.push({ fn: function () { App.navigate("donors", { id: d.id }); } });
        });
        if (r.donors.length > MAX) html += more(r.donors.length - MAX);
      }

      panel.innerHTML = html;
      panel.classList.add("open");
      panel.querySelectorAll(".gs-item").forEach(function (el) {
        el.addEventListener("mousedown", function (e) { e.preventDefault(); }); // منع فقدان التركيز قبل النقر
        el.addEventListener("click", function () { var i = +el.getAttribute("data-i"); if (items[i]) go(items[i]); });
      });
    }

    function highlight() {
      var els = panel.querySelectorAll(".gs-item");
      els.forEach(function (el, i) {
        var on = i === active;
        el.classList.toggle("active", on);
        if (on) el.scrollIntoView({ block: "nearest" });
      });
    }

    var deb = U.debounce(render, 150);
    input.addEventListener("input", deb);
    input.addEventListener("focus", function () { if (input.value.trim()) render(); });
    input.addEventListener("keydown", function (e) {
      var n = items.length;
      if (e.key === "Escape") { close(); input.blur(); }
      else if (e.key === "ArrowDown" && n) { e.preventDefault(); active = (active + 1) % n; highlight(); }
      else if (e.key === "ArrowUp" && n) { e.preventDefault(); active = (active - 1 + n) % n; highlight(); }
      else if (e.key === "Enter" && n) { e.preventDefault(); go(items[active >= 0 ? active : 0]); }
    });
    document.addEventListener("click", function (e) { if (!wrap.contains(e.target)) close(); });
  };
})(window);

</script>
  <script>
/* =================================================================
   app.js — التحكّم العام والتنقّل بين الأقسام
   ================================================================= */
(function (global) {
  "use strict";
  var App = global.App || (global.App = { views: {} });

  var NAV = [
    { id: "dashboard",     icon: "🏠", label: "الرئيسية",  title: "الرئيسية",         sub: "نظرة عامة وإحصائيات" },
    { id: "beneficiaries", icon: "👨‍👩‍👧‍👦", label: "العائلات", title: "العائلات",        sub: "ملفّات العائلات والحالات الاجتماعية", badge: function () { return DB.count("beneficiaries"); } },
    { id: "members",       icon: "👤", label: "المنتفعون", title: "المنتفعون",        sub: "أفراد العائلات المنتفعون", badge: function () { return DB.count("members"); } },
    { id: "donors",        icon: "🤝", label: "المتبرّعون", title: "المتبرّعون",       sub: "المحسنون وتبرّعاتهم", badge: function () { return DB.count("donors"); } },
    { id: "ihsan",         icon: "📋", label: "استمارة الإحسان", title: "استمارة جمعية الإحسان", sub: "العائلة المنتفعة والمتبرّع في استمارة واحدة", badge: function () { return DB.count("ihsan"); } },
    { id: "finance",       icon: "💰", label: "الشأن المالي", title: "الشأن المالي",    sub: "المساعدات والتبرعات والمصاريف والمداخيل" },
    { id: "settings",      icon: "⚙️", label: "الإعدادات", title: "الإعدادات",        sub: "معلومات الجمعية والنسخ الاحتياطي" }
  ];

  var current = "dashboard";

  App.navigate = function (view, params) {
    if (!App.views[view]) view = "dashboard";
    current = view;
    try { location.hash = view; } catch (e) {}
    renderNav();
    var meta = NAV.filter(function (n) { return n.id === view; })[0] || NAV[0];
    document.getElementById("pageTitle").textContent = meta.title;
    document.getElementById("pageSub").textContent = meta.sub;
    var content = document.getElementById("content");
    content.innerHTML = "";
    // إغلاق القائمة الجانبية على الجوّال
    document.getElementById("sidebar").classList.remove("show");
    try {
      App.views[view](content, params);
    } catch (e) {
      console.error(e);
      content.innerHTML = '<div class="empty"><div class="e-ico">⚠️</div><h4>حدث خطأ في عرض هذا القسم</h4><p class="muted">' + U.esc(e.message) + "</p></div>";
    }
    content.scrollTop = 0;
    document.querySelector(".main").scrollTop = 0;
  };

  function renderNav() {
    var nav = document.getElementById("nav");
    nav.innerHTML = NAV.map(function (n) {
      var badge = "";
      if (n.badge) { var v = n.badge(); if (v) badge = '<span class="badge">' + U.fmtNum(v) + "</span>"; }
      return '<button class="' + (current === n.id ? "active" : "") + '" data-nav="' + n.id + '">' +
        '<span class="ico">' + n.icon + "</span><span>" + n.label + "</span>" + badge + "</button>";
    }).join("");
    nav.querySelectorAll("[data-nav]").forEach(function (el) {
      el.onclick = function () { App.navigate(el.getAttribute("data-nav")); };
    });
  }

  // إعادة رسم الترويسة والشارات بعد تغيّر الإعدادات أو البيانات
  App.refreshChrome = function () {
    var s = DB.settings();
    document.getElementById("brandName").textContent = s.orgName;
    document.getElementById("brandBranch").textContent = s.orgBranch || "";
    renderNav();
  };

  function init() {
    App.refreshChrome();
    if (App.initGlobalSearch) App.initGlobalSearch();
    var start = (location.hash || "").replace("#", "");
    App.navigate(App.views[start] ? start : "dashboard");

    document.getElementById("menuToggle").onclick = function () {
      document.getElementById("sidebar").classList.toggle("show");
    };
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})(window);

</script>
