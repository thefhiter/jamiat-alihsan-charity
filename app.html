  <!-- خطوط عربية (تتحوّل تلقائياً لخطوط النظام عند انقطاع الإنترنت) -->

  <style>
/* =================================================================
   جمعية الإحسان الخيرية — نظام إدارة العائلات والمتبرعين
   Al-Ihsan Charity — Management System Stylesheet (RTL)
   ================================================================= */

:root {
  --green-900: #0f3d2e;
  --green-800: #14513c;
  --green-700: #1b6b4f;
  --green-600: #218066;
  --green-500: #2a9d77;
  --green-100: #e3f4ec;
  --green-50:  #f1faf5;
  --gold-600:  #c79a32;
  --gold-500:  #e0b84a;
  --gold-100:  #fbf3da;
  --ink:       #1f2a28;
  --muted:     #647067;
  --line:      #dfe7e2;
  --bg:        #f4f7f5;
  --card:      #ffffff;
  --danger:    #c0392b;
  --danger-bg: #fdecea;
  --info:      #2563eb;
  --warn:      #b7791f;
  --radius:    14px;
  --radius-sm: 9px;
  --shadow:    0 6px 22px rgba(15, 61, 46, 0.08);
  --shadow-lg: 0 14px 40px rgba(15, 61, 46, 0.16);
  --sidebar-w: 248px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
}

body {
  font-family: "Cairo", "Tajawal", "Segoe UI", "Tahoma", sans-serif;
  background: var(--bg);
  color: var(--ink);
  direction: rtl;
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

button { font-family: inherit; cursor: pointer; }
input, select, textarea { font-family: inherit; font-size: 15px; }
a { color: var(--green-700); text-decoration: none; }

/* ---------- App layout ---------- */
.app {
  display: grid;
  grid-template-columns: var(--sidebar-w) 1fr;
  grid-template-rows: 100vh;
}

/* ---------- Sidebar ---------- */
.sidebar {
  background: linear-gradient(180deg, var(--green-900), var(--green-800));
  color: #eaf5ef;
  display: flex;
  flex-direction: column;
  padding: 0;
  overflow-y: auto;
}
.brand {
  padding: 22px 20px 18px;
  border-bottom: 1px solid rgba(255,255,255,0.10);
  display: flex;
  align-items: center;
  gap: 12px;
}
.brand .logo {
  width: 46px; height: 46px;
  flex: 0 0 46px;
  border-radius: 12px;
  background: radial-gradient(circle at 30% 30%, var(--gold-500), var(--gold-600));
  display: grid; place-items: center;
  font-size: 24px;
  box-shadow: inset 0 0 0 2px rgba(255,255,255,0.25);
}
.brand h1 { font-size: 16px; margin: 0; font-weight: 800; line-height: 1.35; }
.brand span { font-size: 11.5px; color: #aeccbd; display: block; }

.nav { padding: 12px 10px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
.nav button {
  display: flex; align-items: center; gap: 12px;
  width: 100%;
  background: transparent;
  border: none;
  color: #d7e8df;
  padding: 11px 14px;
  border-radius: 10px;
  font-size: 15px;
  font-weight: 600;
  text-align: right;
  transition: background .15s, color .15s;
}
.nav button .ico { font-size: 18px; width: 22px; text-align: center; }
.nav button:hover { background: rgba(255,255,255,0.08); color: #fff; }
.nav button.active {
  background: var(--gold-500);
  color: var(--green-900);
  box-shadow: var(--shadow);
}
.nav .badge {
  margin-inline-start: auto;
  background: rgba(255,255,255,0.16);
  color: #fff;
  font-size: 12px; font-weight: 700;
  padding: 1px 9px; border-radius: 20px;
  min-width: 22px; text-align: center;
}
.nav button.active .badge { background: rgba(15,61,46,0.20); color: var(--green-900); }

.sidebar-foot {
  padding: 14px 18px;
  font-size: 11.5px;
  color: #9fc1b1;
  border-top: 1px solid rgba(255,255,255,0.10);
}

/* ---------- Main ---------- */
.main { overflow-y: auto; height: 100vh; }
.topbar {
  position: sticky; top: 0; z-index: 20;
  background: rgba(244,247,245,0.92);
  backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--line);
  padding: 16px 28px;
  display: flex; align-items: center; gap: 16px;
}
.topbar h2 { margin: 0; font-size: 21px; font-weight: 800; color: var(--green-900); }
.topbar .sub { color: var(--muted); font-size: 13px; }
.topbar .spacer { flex: 1; }
.page-titles { min-width: 0; }

/* ---------- البحث الشامل ---------- */
.global-search { position: relative; width: 340px; max-width: 42vw; }
.global-search .gs-ico {
  position: absolute; inset-inline-start: 12px; top: 50%; transform: translateY(-50%);
  color: var(--muted); font-size: 16px; pointer-events: none;
}
.global-search input {
  width: 100%; padding: 10px 38px 10px 14px;
  border: 1px solid var(--line); border-radius: 11px; background: #fff; outline: none;
  transition: border .12s, box-shadow .12s;
}
.global-search input:focus { border-color: var(--green-500); box-shadow: 0 0 0 3px var(--green-100); }
.gs-results {
  position: absolute; top: calc(100% + 8px); inset-inline-start: 0; inset-inline-end: 0;
  background: #fff; border: 1px solid var(--line); border-radius: 14px;
  box-shadow: var(--shadow-lg); max-height: 64vh; overflow-y: auto; z-index: 60; display: none;
  padding: 4px 0;
}
.gs-results.open { display: block; }
.gs-group { padding: 9px 16px 5px; font-size: 11.5px; font-weight: 800; color: var(--muted); }
.gs-item { display: flex; align-items: center; gap: 11px; padding: 9px 16px; cursor: pointer; }
.gs-item:hover, .gs-item.active { background: var(--green-50); }
.gs-item .gi { flex: 0 0 32px; width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; font-size: 16px; }
.gs-item .gi.ic-green { background: var(--green-100); }
.gs-item .gi.ic-gold { background: var(--gold-100); }
.gs-item .gi.ic-blue { background: #e6effe; }
.gs-item .gtxt { min-width: 0; flex: 1; }
.gs-item .gt { font-weight: 700; font-size: 14px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gs-item .gsub { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gs-item .gs-tag { font-size: 10px; padding: 1px 7px; }
.gs-empty { padding: 20px 16px; text-align: center; color: var(--muted); font-size: 13px; }
.gs-more { padding: 7px 16px; font-size: 12px; color: var(--green-700); background: var(--green-50); }

.content { padding: 24px 28px 60px; }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  border: 1px solid transparent;
  background: var(--green-600);
  color: #fff;
  padding: 10px 16px;
  border-radius: 10px;
  font-weight: 700; font-size: 14.5px;
  transition: transform .06s, filter .15s, background .15s;
  white-space: nowrap;
}
.btn:hover { filter: brightness(1.06); }
.btn:active { transform: translateY(1px); }
.btn .ico { font-size: 17px; }
.btn.secondary { background: #fff; color: var(--green-800); border-color: var(--line); }
.btn.secondary:hover { background: var(--green-50); }
.btn.gold { background: var(--gold-500); color: var(--green-900); }
.btn.ghost { background: transparent; color: var(--green-800); border-color: transparent; }
.btn.ghost:hover { background: var(--green-100); }
.btn.danger { background: var(--danger); }
.btn.sm { padding: 6px 11px; font-size: 13px; border-radius: 8px; }
.btn.block { width: 100%; justify-content: center; }
.btn:disabled { opacity: .5; cursor: not-allowed; }

/* ---------- Cards & stat tiles ---------- */
.cards { display: grid; gap: 16px; }
.grid-4 { grid-template-columns: repeat(4, 1fr); }
.grid-3 { grid-template-columns: repeat(3, 1fr); }
.grid-2 { grid-template-columns: repeat(2, 1fr); }

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}
.card .card-head {
  display: flex; align-items: center; gap: 10px;
  padding: 16px 20px; border-bottom: 1px solid var(--line);
}
.card .card-head h3 { margin: 0; font-size: 16px; font-weight: 800; color: var(--green-900); }
.card .card-head .spacer { flex: 1; }
.card .card-body { padding: 18px 20px; }

.stat {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 18px 20px;
  min-height: 92px;
  border-radius: var(--radius);
  background: var(--card);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
}
.stat .ico-bg {
  flex: 0 0 46px;
  width: 46px; height: 46px; border-radius: 12px;
  display: grid; place-items: center; font-size: 23px;
}
.stat .meta { flex: 1 1 auto; min-width: 0; }
.stat .label { color: var(--muted); font-size: 13px; font-weight: 600; line-height: 1.35; }
.stat .value { font-size: 27px; font-weight: 800; color: var(--green-900); margin-top: 3px; line-height: 1.2; word-break: break-word; }
.stat .unit { font-size: 14px; color: var(--muted); font-weight: 600; }
.stat.green .ico-bg { background: var(--green-100); color: var(--green-700); }
.stat.gold  .ico-bg { background: var(--gold-100); color: var(--gold-600); }
.stat.blue  .ico-bg { background: #e6effe; color: var(--info); }
.stat.red   .ico-bg { background: var(--danger-bg); color: var(--danger); }

/* ---------- Toolbar / search ---------- */
.toolbar {
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 18px; flex-wrap: wrap;
}
.search {
  position: relative; flex: 1; min-width: 220px; max-width: 420px;
}
.search input {
  width: 100%;
  padding: 10px 40px 10px 14px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #fff;
  outline: none;
}
.search input:focus { border-color: var(--green-500); box-shadow: 0 0 0 3px var(--green-100); }
.search .si {
  position: absolute; inset-inline-start: 12px; top: 50%; transform: translateY(-50%);
  color: var(--muted); font-size: 17px; pointer-events: none;
}
.filter-pills { display: flex; gap: 6px; flex-wrap: wrap; }
.pill {
  border: 1px solid var(--line); background: #fff; color: var(--muted);
  padding: 7px 13px; border-radius: 20px; font-size: 13px; font-weight: 700;
}
.pill.active { background: var(--green-700); color: #fff; border-color: var(--green-700); }

/* ---------- Table ---------- */
.table-wrap {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
}
table { width: 100%; border-collapse: collapse; }
thead th {
  background: var(--green-50);
  color: var(--green-900);
  font-weight: 800; font-size: 13px;
  text-align: right;
  padding: 13px 16px;
  border-bottom: 2px solid var(--green-100);
  white-space: nowrap;
}
tbody td { padding: 12px 16px; border-bottom: 1px solid var(--line); font-size: 14px; vertical-align: middle; }
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover { background: var(--green-50); }
.t-actions { display: flex; gap: 6px; justify-content: flex-start; }
.icon-btn {
  border: 1px solid var(--line); background: #fff;
  width: 32px; height: 32px; border-radius: 8px;
  display: grid; place-items: center; font-size: 15px; color: var(--muted);
  transition: all .12s;
}
.icon-btn:hover { background: var(--green-100); color: var(--green-800); border-color: var(--green-100); }
.icon-btn.danger:hover { background: var(--danger-bg); color: var(--danger); border-color: var(--danger-bg); }

.tag {
  display: inline-block; padding: 3px 11px; border-radius: 20px;
  font-size: 12px; font-weight: 700;
}
.tag.green { background: var(--green-100); color: var(--green-800); }
.tag.gold  { background: var(--gold-100); color: var(--gold-600); }
.tag.blue  { background: #e6effe; color: var(--info); }
.tag.gray  { background: #eef1ef; color: var(--muted); }
.tag.red   { background: var(--danger-bg); color: var(--danger); }
.tag.amber { background: #fef3c7; color: var(--warn); }

.money { font-weight: 800; font-variant-numeric: tabular-nums; }
.money.in  { color: var(--green-700); }
.money.out { color: var(--danger); }

/* ---------- Empty state ---------- */
.empty {
  text-align: center; padding: 54px 20px; color: var(--muted);
}
.empty .e-ico { font-size: 52px; margin-bottom: 10px; opacity: .7; }
.empty h4 { margin: 0 0 4px; color: var(--ink); font-size: 17px; }

/* ---------- Modal ---------- */
.modal-overlay {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(15, 30, 24, 0.45);
  display: none; align-items: flex-start; justify-content: center;
  padding: 40px 16px; overflow-y: auto;
}
.modal-overlay.open { display: flex; }
.modal {
  background: #fff; border-radius: 16px;
  width: 100%; max-width: 720px;
  box-shadow: var(--shadow-lg);
  animation: pop .18s ease;
  margin: auto 0;
  display: flex;
  flex-direction: column;
  max-height: calc(100vh - 80px);   /* لا يتجاوز الشاشة، والجسم يتمرّر داخلياً */
}
.modal.wide { max-width: 920px; }
@keyframes pop { from { transform: translateY(14px) scale(.98); opacity: 0; } to { transform: none; opacity: 1; } }
.modal-head {
  display: flex; align-items: center; gap: 12px;
  padding: 18px 22px; border-bottom: 1px solid var(--line);
  flex: 0 0 auto;
}
.modal-head h3 { margin: 0; font-size: 18px; font-weight: 800; color: var(--green-900); }
.modal-head .spacer { flex: 1; }
.modal-close {
  border: none; background: #f0f3f1; width: 34px; height: 34px;
  border-radius: 9px; font-size: 18px; color: var(--muted);
}
.modal-close:hover { background: var(--danger-bg); color: var(--danger); }
.modal-body { padding: 22px; flex: 1 1 auto; min-height: 0; overflow-y: auto; }
.modal-foot {
  padding: 16px 22px; border-top: 1px solid var(--line);
  display: flex; gap: 10px; justify-content: flex-start;
  background: #fff; border-radius: 0 0 16px 16px;
  flex: 0 0 auto;
}

/* ---------- Forms ---------- */
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 18px; }
.form-grid .full { grid-column: 1 / -1; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field label { font-size: 13px; font-weight: 700; color: var(--green-900); }
.field label .req { color: var(--danger); }
.field input, .field select, .field textarea {
  padding: 9px 12px; border: 1px solid var(--line); border-radius: 9px;
  background: #fff; outline: none; transition: border .12s, box-shadow .12s;
  width: 100%;
}
.field input:focus, .field select:focus, .field textarea:focus {
  border-color: var(--green-500); box-shadow: 0 0 0 3px var(--green-100);
}
.field textarea { resize: vertical; min-height: 64px; }
.field .hint { font-size: 11.5px; color: var(--muted); }

.fieldset {
  border: 1px solid var(--line); border-radius: 12px;
  padding: 14px 16px 16px; margin-top: 4px;
}
.fieldset > legend {
  font-size: 13.5px; font-weight: 800; color: var(--green-700);
  padding: 0 8px; margin-inline-start: 4px;
}
.radio-row { display: flex; flex-wrap: wrap; gap: 8px; }
.radio-chip {
  position: relative; cursor: pointer;
}
.radio-chip input { position: absolute; opacity: 0; }
.radio-chip span {
  display: inline-block; padding: 7px 14px; border-radius: 20px;
  border: 1px solid var(--line); background: #fff; font-size: 13.5px; font-weight: 700; color: var(--muted);
  transition: all .12s;
}
.radio-chip input:checked + span {
  background: var(--green-700); color: #fff; border-color: var(--green-700);
}
.check-inline { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; }
.check-inline input { width: 17px; height: 17px; accent-color: var(--green-600); }

/* children mini-table inside form */
.children-table { width: 100%; border-collapse: collapse; margin-top: 6px; font-size: 13px; }
.children-table th { background: var(--green-50); padding: 8px; font-size: 12px; border: 1px solid var(--line); }
.children-table td { padding: 4px; border: 1px solid var(--line); }
.children-table input, .children-table select { padding: 6px 8px; border: 1px solid var(--line); border-radius: 7px; }
.children-table .x { color: var(--danger); cursor: pointer; font-weight: 800; }

/* ---------- Detail view ---------- */
.detail-grid { display: grid; grid-template-columns: 320px 1fr; gap: 20px; align-items: start; }
.info-list { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 18px; }
.info-list.one { grid-template-columns: 1fr; }
.info-item .k { font-size: 12px; color: var(--muted); font-weight: 700; }
.info-item .v { font-size: 14.5px; font-weight: 700; color: var(--ink); }
.profile-card { text-align: center; }
.profile-avatar {
  width: 84px; height: 84px; border-radius: 50%; margin: 0 auto 12px;
  background: linear-gradient(135deg, var(--green-500), var(--green-700));
  color: #fff; display: grid; place-items: center; font-size: 34px; font-weight: 800;
}
.profile-card .pname { font-size: 19px; font-weight: 800; color: var(--green-900); }
.profile-card .pfile { color: var(--muted); font-size: 13px; }

/* ---------- Toast ---------- */
.toast-wrap {
  position: fixed; bottom: 22px; inset-inline-start: 22px; z-index: 200;
  display: flex; flex-direction: column; gap: 10px;
}
.toast {
  background: #fff; border: 1px solid var(--line);
  border-inline-start: 4px solid var(--green-500);
  border-radius: 12px; padding: 13px 18px; min-width: 260px;
  box-shadow: var(--shadow-lg); font-weight: 700; font-size: 14px;
  display: flex; align-items: center; gap: 10px;
  animation: slidein .25s ease;
}
@keyframes slidein { from { transform: translateY(16px); opacity: 0; } to { transform: none; opacity: 1; } }
.toast.success { border-inline-start-color: var(--green-500); }
.toast.error   { border-inline-start-color: var(--danger); }
.toast.info    { border-inline-start-color: var(--info); }
.toast .ti { font-size: 19px; }

/* ---------- Misc ---------- */
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.muted { color: var(--muted); }
.mt-20 { margin-top: 20px; }
.mb-16 { margin-bottom: 16px; }
.sub-tabs { display: flex; gap: 6px; border-bottom: 1px solid var(--line); margin-bottom: 18px; flex-wrap: wrap; }
.sub-tabs button {
  background: none; border: none; padding: 10px 16px; font-weight: 700; font-size: 14.5px;
  color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -1px;
}
.sub-tabs button.active { color: var(--green-800); border-bottom-color: var(--gold-500); }

.bars { display: flex; flex-direction: column; gap: 12px; }
.bar-row { display: grid; grid-template-columns: 130px 1fr 60px; align-items: center; gap: 12px; font-size: 13.5px; }
.bar-track { height: 12px; border-radius: 8px; background: var(--green-50); overflow: hidden; }
.bar-fill { height: 100%; border-radius: 8px; background: linear-gradient(90deg, var(--green-500), var(--green-700)); }
.bar-row .bv { font-weight: 800; text-align: left; }

/* ---------- Responsive ---------- */
@media (max-width: 1080px) {
  .grid-4 { grid-template-columns: repeat(2, 1fr); }
  .grid-3 { grid-template-columns: repeat(2, 1fr); }
  .detail-grid { grid-template-columns: 1fr; }
}
@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; }
  .sidebar { position: fixed; z-index: 50; inset-inline-start: -100%; width: 80%; height: 100vh; transition: inset-inline-start .2s; }
  .sidebar.show { inset-inline-start: 0; }
  .form-grid, .grid-4, .grid-3, .grid-2, .info-list { grid-template-columns: 1fr; }
  .content { padding: 16px; }
  .menu-toggle { display: inline-flex !important; }
  .topbar { padding: 12px 14px; gap: 10px; }
  .topbar .sub { display: none; }
  .global-search { width: auto; flex: 1 1 auto; max-width: none; }
  .modal-overlay { padding: 14px 10px; }
  .modal { max-height: calc(100vh - 28px); }
}
.menu-toggle { display: none; }

/* ---------- Print ---------- */
@media print {
  .sidebar, .topbar, .toolbar, .no-print, .modal-foot, .menu-toggle { display: none !important; }
  .app { display: block; }
  .main { height: auto; overflow: visible; }
  .content { padding: 0; }
  .modal-overlay { position: static; background: none; display: block !important; padding: 0; }
  .modal { box-shadow: none; max-width: 100%; max-height: none; display: block; }
  .modal-body { overflow: visible; }

  <script>
/* =================================================================
   db.js — طبقة تخزين البيانات (Local Storage)
   تخزّن كل البيانات محلياً في المتصفّح، وتعمل بدون إنترنت أو خادم.
   ================================================================= */
(function (global) {
  "use strict";

  var PREFIX = "ihsan:";
  var COLLECTIONS = ["beneficiaries", "members", "donors", "aid", "donations", "expenses", "incomes", "ihsan"];
  var SCHEMA_VERSION = 1;

  function key(name) { return PREFIX + name; }

  function read(name) {
    try {
      var raw = localStorage.getItem(key(name));
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      console.error("DB read error for " + name, e);
      return [];
    }
  }

  function write(name, arr) {
    try {
      localStorage.setItem(key(name), JSON.stringify(arr));
      return true;
    } catch (e) {
      console.error("DB write error for " + name, e);
      alert("تعذّر حفظ البيانات. قد تكون مساحة التخزين ممتلئة. يُرجى أخذ نسخة احتياطية.");
      return false;
    }
  }

  /* مُعرّف فريد بسيط ومقروء */
  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  var DB = {
    collections: COLLECTIONS,

    all: function (name) { return read(name); },

    get: function (name, id) {
      var arr = read(name);
      for (var i = 0; i < arr.length; i++) if (arr[i].id === id) return arr[i];
      return null;
    },

    /* يرجع السجلات المرتبطة بحقل معيّن (مثلاً مساعدات منتفع) */
    where: function (name, field, value) {
      return read(name).filter(function (r) { return r[field] === value; });
    },

    insert: function (name, obj) {
      var arr = read(name);
      obj.id = obj.id || uid();
      obj.createdAt = obj.createdAt || new Date().toISOString();
      obj.archived = obj.archived || false;
      arr.push(obj);
      write(name, arr);
      return obj;
    },

    update: function (name, id, patch) {
      var arr = read(name);
      for (var i = 0; i < arr.length; i++) {
        if (arr[i].id === id) {
          arr[i] = Object.assign({}, arr[i], patch, { id: id, updatedAt: new Date().toISOString() });
          write(name, arr);
          return arr[i];
        }
      }
      return null;
    },

    remove: function (name, id) {
      var arr = read(name).filter(function (r) { return r.id !== id; });
      write(name, arr);
    },

    /* أرشفة بدل الحذف النهائي (حسب المواصفات: قائمة الأرشيف) */
    setArchived: function (name, id, value) {
      return DB.update(name, id, { archived: value });
    },

    count: function (name, includeArchived) {
      var arr = read(name);
      if (includeArchived) return arr.length;
      return arr.filter(function (r) { return !r.archived; }).length;
    },

    /* مجموع حقل رقمي */
    sum: function (name, field, filterFn) {
      return read(name).reduce(function (s, r) {
        if (filterFn && !filterFn(r)) return s;
        var v = parseFloat(r[field]);
        return s + (isNaN(v) ? 0 : v);
      }, 0);
    },

    /* ----- النسخ الاحتياطي والاسترجاع ----- */
    exportAll: function () {
      var data = { schema: SCHEMA_VERSION, exportedAt: new Date().toISOString(), data: {} };
      COLLECTIONS.forEach(function (c) { data.data[c] = read(c); });
      data.settings = DB.settings();
      return data;
    },

    importAll: function (payload, mode) {
      // mode: "replace" | "merge"
      if (!payload || !payload.data) throw new Error("ملف غير صالح");
      COLLECTIONS.forEach(function (c) {
        var incoming = payload.data[c] || [];
        if (mode === "merge") {
          var existing = read(c);
          var ids = {};
          existing.forEach(function (r) { ids[r.id] = true; });
          incoming.forEach(function (r) { if (!ids[r.id]) existing.push(r); });
          write(c, existing);
        } else {
          write(c, incoming);
        }
      });
      if (payload.settings) DB.saveSettings(payload.settings);
    },

    clearAll: function () {
      COLLECTIONS.forEach(function (c) { localStorage.removeItem(key(c)); });
    },

    /* ----- الإعدادات ----- */
    settings: function () {
      try {
        var raw = localStorage.getItem(key("settings"));
        return Object.assign({
          orgName: "جمعية الإحسان الخيرية",
          orgBranch: "بمنزل النور",
          currency: "د.ت",
          year: new Date().getFullYear()
        }, raw ? JSON.parse(raw) : {});
      } catch (e) { return { orgName: "جمعية الإحسان الخيرية", orgBranch: "بمنزل النور", currency: "د.ت" }; }
    },
    saveSettings: function (s) {
      var merged = Object.assign(DB.settings(), s);
      localStorage.setItem(key("settings"), JSON.stringify(merged));
      return merged;
    },

    /* بذور تجريبية اختيارية لأول تشغيل */
    isEmpty: function () {
      return COLLECTIONS.every(function (c) { return read(c).length === 0; });
    }
  };

  /* -----------------------------------------------------------------
     ترحيل لمرّة واحدة: تحويل «الأبناء/الأفراد» المضمّنين داخل ملفّ العائلة
     (children[]) إلى سجلّات مستقلّة في مجموعة «المنتفعون» (members)،
     مع ربط كل فرد بعائلته. عملية آمنة وقابلة للتكرار (محميّة بعلامة لكل عائلة).
     ----------------------------------------------------------------- */
  function migrateMembers() {
    var fams = read("beneficiaries");
    if (!fams.length) return;
    var members = read("members");
    var membersChanged = false, famsChanged = false;
    fams.forEach(function (b) {
      if (b.childrenMigrated) return;
      (b.children || []).forEach(function (k) {
        if (!k || !k.name) return;
        members.push({
          id: uid(),
          createdAt: new Date().toISOString(),
          archived: false,
          familyId: b.id,
          firstName: k.name,
          lastName: "",
          relation: "ابن / بنت",
          dob: k.dob || "",
          grade: k.grade || "",
          work: k.work || "",
          health: k.health || "عادية"
        });
        membersChanged = true;
      });
      b.childrenMigrated = true;
      famsChanged = true;
    });
    if (membersChanged) write("members", members);
    if (famsChanged) write("beneficiaries", fams);
  }

  try { migrateMembers(); } catch (e) { console.error("members migration failed", e); }

  global.DB = DB;
})(window);

</script>

/* =================================================================
   utils.js — أدوات مساعدة عامة (تنسيق، نوافذ، تنبيهات، طباعة)
   ================================================================= */
(function (global) {
  "use strict";

  var U = {};

  /* ----- تأمين النصوص ضد HTML ----- */
  U.esc = function (s) {
    if (s === null || s === undefined) return "";
    return String(s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  };

  /* ----- التاريخ ----- */
  U.today = function () { return new Date().toISOString().slice(0, 10); };

  U.fmtDate = function (iso) {
    if (!iso) return "—";
    var d = new Date(iso.length <= 10 ? iso + "T00:00:00" : iso);
    if (isNaN(d)) return U.esc(iso);
    var dd = ("0" + d.getDate()).slice(-2);
    var mm = ("0" + (d.getMonth() + 1)).slice(-2);
    return dd + "/" + mm + "/" + d.getFullYear();
  };

  U.age = function (iso) {
    if (!iso) return "";
    var d = new Date(iso); if (isNaN(d)) return "";
    var diff = Date.now() - d.getTime();
    var a = Math.floor(diff / (365.25 * 24 * 3600 * 1000));
    return a >= 0 && a < 130 ? a : "";
  };

  /* ----- المال ----- */
  U.fmtMoney = function (n) {
    var v = parseFloat(n) || 0;
    var cur = (global.DB && DB.settings().currency) || "د.ت";
    return v.toLocaleString("ar-TN", { minimumFractionDigits: v % 1 ? 3 : 0, maximumFractionDigits: 3 }) + " " + cur;
  };
  U.fmtNum = function (n) { return (parseFloat(n) || 0).toLocaleString("ar-TN"); };

  /* ----- الأحرف الأولى للصورة الرمزية ----- */
  U.initials = function (name, last) {
    var a = (name || "").trim().charAt(0);
    var b = (last || "").trim().charAt(0);
    return (a + b) || "؟";
  };

  /* ----- التنبيهات (Toast) ----- */
  U.toast = function (msg, type) {
    type = type || "success";
    var wrap = document.getElementById("toastWrap");
    if (!wrap) { wrap = document.createElement("div"); wrap.id = "toastWrap"; wrap.className = "toast-wrap"; document.body.appendChild(wrap); }
    var icons = { success: "✅", error: "⛔", info: "ℹ️" };
    var t = document.createElement("div");
    t.className = "toast " + type;
    t.innerHTML = '<span class="ti">' + (icons[type] || "✅") + '</span><span>' + U.esc(msg) + "</span>";
    wrap.appendChild(t);
    setTimeout(function () {
      t.style.transition = "opacity .3s, transform .3s";
      t.style.opacity = "0"; t.style.transform = "translateX(-10px)";
      setTimeout(function () { t.remove(); }, 320);
    }, 3200);
  };

  /* ----- النوافذ المنبثقة (Modal) ----- */
  var overlay;
  function ensureOverlay() {
    if (overlay) return overlay;
    overlay = document.createElement("div");
    overlay.className = "modal-overlay";
    overlay.id = "modalOverlay";
    overlay.addEventListener("mousedown", function (e) { if (e.target === overlay) U.closeModal(); });
    document.body.appendChild(overlay);
    document.addEventListener("keydown", function (e) { if (e.key === "Escape") U.closeModal(); });
    return overlay;
  }

  U.openModal = function (opts) {
    ensureOverlay();
    var wide = opts.wide ? " wide" : "";
    overlay.innerHTML =
      '<div class="modal' + wide + '" role="dialog" aria-modal="true">' +
        '<div class="modal-head"><h3>' + U.esc(opts.title) + '</h3><div class="spacer"></div>' +
          '<button class="modal-close" id="mClose" title="إغلاق">✕</button></div>' +
        '<div class="modal-body" id="mBody">' + opts.body + "</div>" +
        (opts.footer ? '<div class="modal-foot" id="mFoot">' + opts.footer + "</div>" : "") +
      "</div>";
    overlay.classList.add("open");
    document.getElementById("mClose").onclick = U.closeModal;
    // نمرّر عنصر النافذة بالكامل (الجسم + التذييل) ليتمكّن onOpen من ربط أزرار الحفظ/الإلغاء في التذييل
    if (typeof opts.onOpen === "function") opts.onOpen(overlay.querySelector(".modal"));
  };

  U.closeModal = function () {
    if (overlay) { overlay.classList.remove("open"); overlay.innerHTML = ""; }
  };

  /* ----- تأكيد ----- */
  U.confirm = function (opts) {
    var danger = opts.danger ? "danger" : "";
    U.openModal({
      title: opts.title || "تأكيد",
      body: '<p style="font-size:15px;margin:4px 0 0">' + U.esc(opts.message) + "</p>",
      footer:
        '<button class="btn ' + danger + '" id="cfOk">' + U.esc(opts.okText || "نعم، متابعة") + "</button>" +
        '<button class="btn secondary" id="cfCancel">إلغاء</button>',
      onOpen: function () {
        document.getElementById("cfOk").onclick = function () { U.closeModal(); opts.onOk && opts.onOk(); };
        document.getElementById("cfCancel").onclick = U.closeModal;
      }
    });
  };

  /* ----- قراءة قيم النموذج ----- */
  U.formData = function (root) {
    var out = {};
    root.querySelectorAll("[data-f]").forEach(function (el) {
      var k = el.getAttribute("data-f");
      if (el.type === "checkbox") out[k] = el.checked;
      else if (el.type === "radio") { if (el.checked) out[k] = el.value; }
      else out[k] = el.value.trim();
    });
    return out;
  };

  /* ----- بحث نصّي بسيط ----- */
  U.match = function (obj, q, fields) {
    if (!q) return true;
    q = q.toLowerCase();
    return fields.some(function (f) {
      var v = obj[f]; return v && String(v).toLowerCase().indexOf(q) !== -1;
    });
  };

  /* ----- debounce ----- */
  U.debounce = function (fn, ms) {
    var t; return function () { var a = arguments, c = this; clearTimeout(t); t = setTimeout(function () { fn.apply(c, a); }, ms || 200); };
  };

  /* ----- تنزيل ملف ----- */
  U.download = function (filename, content, mime) {
    var blob = new Blob(["﻿" + content], { type: (mime || "text/plain") + ";charset=utf-8" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 100);
  };

  /* ----- تصدير CSV ----- */
  U.toCSV = function (rows, headers) {
    function cell(v) {
      v = (v === null || v === undefined) ? "" : String(v);
      if (/[",\n;]/.test(v)) v = '"' + v.replace(/"/g, '""') + '"';
      return v;
    }
    var lines = [headers.map(function (h) { return cell(h.label); }).join(",")];
    rows.forEach(function (r) {
      lines.push(headers.map(function (h) { return cell(typeof h.get === "function" ? h.get(r) : r[h.key]); }).join(","));
    });
    return lines.join("\r\n");
  };

  /* ----- الطباعة (نافذة مستقلّة) ----- */
  U.printHTML = function (title, innerHTML) {
    var s = (global.DB && DB.settings()) || {};
    var w = window.open("", "_blank", "width=900,height=700");
    if (!w) { U.toast("يُرجى السماح بالنوافذ المنبثقة للطباعة", "error"); return; }
    w.document.write(
      '<!doctype html><html dir="rtl" lang="ar"><head><meta charset="utf-8"><title>' + U.esc(title) + "</title>" +
      "<style>" +
      "body{font-family:'Cairo','Segoe UI',Tahoma,sans-serif;color:#1f2a28;padding:28px;direction:rtl}" +
      ".ph{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid #1b6b4f;padding-bottom:12px;margin-bottom:18px}" +
      ".ph h1{font-size:20px;margin:0;color:#0f3d2e}.ph .b{color:#647067;font-size:13px}" +
      ".ph .meta{text-align:left;font-size:12px;color:#647067}" +
      "h2{font-size:17px;color:#14513c;border-bottom:1px solid #dfe7e2;padding-bottom:6px;margin:22px 0 10px}" +
      "table{width:100%;border-collapse:collapse;margin:8px 0;font-size:13px}" +
      "th,td{border:1px solid #cdd8d1;padding:7px 9px;text-align:right}th{background:#eef6f1;color:#0f3d2e}" +
      ".kv{display:grid;grid-template-columns:1fr 1fr;gap:6px 22px;font-size:14px;margin:6px 0}" +
      ".kv div{padding:4px 0;border-bottom:1px dotted #dfe7e2}.kv b{color:#14513c}" +
      ".sign{display:flex;justify-content:space-between;margin-top:48px;font-size:13px}" +
      ".sign div{text-align:center;width:40%}.sign .line{border-top:1px solid #333;margin-top:40px;padding-top:5px}" +
      ".foot{margin-top:30px;text-align:center;color:#9aa8a0;font-size:11px;border-top:1px solid #dfe7e2;padding-top:8px}" +
      "@media print{body{padding:6px}}" +
      "</style></head><body>" +
      '<div class="ph"><div><h1>' + U.esc(s.orgName || "جمعية الإحسان الخيرية") + "</h1>" +
        '<div class="b">' + U.esc(s.orgBranch || "") + "</div></div>" +
        '<div class="meta">' + U.esc(title) + "<br>تاريخ الطباعة: " + U.fmtDate(U.today()) + "</div></div>" +
      innerHTML +
      '<div class="foot">وثيقة صادرة عن نظام إدارة ' + U.esc(s.orgName || "الجمعية") + "</div>" +
      "</body></html>"
    );
    w.document.close();
    setTimeout(function () { w.focus(); w.print(); }, 350);
  };

  /* ----- طباعة قائمة/جدول عام ----- */
  U.printTable = function (title, headers, rows, opts) {
    opts = opts || {};
    var thead = "<tr>" + headers.map(function (h) { return "<th>" + U.esc(h) + "</th>"; }).join("") + "</tr>";
    var tbody = rows.length
      ? rows.map(function (r) { return "<tr>" + r.map(function (c) { return "<td>" + U.esc(c == null ? "" : c) + "</td>"; }).join("") + "</tr>"; }).join("")

  };

  global.U = U;
