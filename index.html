<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>نظام إدارة العائلات والمتبرعين — جمعية الإحسان الخيرية</title>
  <meta name="description" content="نظام لإدارة العائلات المنتفعة والمتبرعين والمساعدات والمداخيل والمصاريف لفائدة الجمعيات الخيرية، يعمل دون اتصال بالإنترنت.">

  <!-- خطوط عربية (تتحوّل تلقائياً لخطوط النظام عند انقطاع الإنترنت) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕌</text></svg>">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <!-- الشريط الجانبي -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="logo">🕌</div>
        <div>
          <h1 id="brandName">جمعية الإحسان الخيرية</h1>
          <span id="brandBranch">بمنزل النور</span>
        </div>
      </div>
      <nav class="nav" id="nav"><!-- يُبنى ديناميكياً --></nav>
      <div class="sidebar-foot">
        نظام إدارة العائلات والمتبرعين<br>
        إصدار 1.0 — يعمل دون إنترنت
      </div>
    </aside>

    <!-- المحتوى الرئيسي -->
    <main class="main">
      <div class="topbar">
        <button class="btn ghost menu-toggle" id="menuToggle" aria-label="القائمة">☰</button>
        <div class="page-titles">
          <h2 id="pageTitle">الرئيسية</h2>
          <div class="sub" id="pageSub">نظرة عامة وإحصائيات</div>
        </div>
        <div class="spacer"></div>
        <div class="global-search" id="globalSearch">
          <span class="gs-ico">🔍</span>
          <input id="gsInput" type="search" autocomplete="off" aria-label="بحث شامل"
                 placeholder="بحث عن عائلة أو فرد أو متبرّع…">
          <div class="gs-results" id="gsResults"></div>
        </div>
      </div>
      <div class="content" id="content"><!-- يُعرض القسم هنا --></div>
    </main>
  </div>

  <div class="toast-wrap" id="toastWrap"></div>

  <!-- النصوص البرمجية (ترتيب التحميل مهمّ) -->
  <script src="js/db.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/beneficiaries.js"></script>
  <script src="js/donors.js"></script>
  <script src="js/finance.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/search.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
